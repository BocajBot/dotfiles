# ── Base ──────────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:usstyle:clipboard"  # truecolor + styled underlines
set -s escape-time 0                              # no Alt/Esc lag in vim & friends
set -g focus-events on
set -g renumber-windows on
set -g base-index 1                               # Alt+1 == first window
set -g extended-keys-format csi-u
setw -g pane-base-index 1

setw -g aggressive-resize on                      # size to the client actually looking
set -g allow-passthrough on                       # kitty image protocol survives tmux
setw -g monitor-activity on                       # dot in status when a background window prints
set -g visual-activity off
set -g pane-border-status off                     # a solo pane needs no title bar
set -g pane-border-format " #P #{pane_current_command} "
set-hook -g window-layout-changed 'if -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'

# ── Prefixless keys (bind -n = no prefix needed) ──────────────────────────
# Everything below is reachable with the LEFT hand alone, left Alt as the
# modifier. Arrow keys are kept as aliases where they made sense, but nothing
# requires them. Layout: WASD moves, shift+WASD resizes.

# Move between panes -- WASD
bind -n M-w select-pane -U  #= move pane up
bind -n M-a select-pane -L  #= move pane left
bind -n M-s if -F "#{==:#{pane_current_command},pi}" "send-keys M-s" "select-pane -D"  #= move pane down (pi pane: send preview)
bind -n M-d if -F "#{==:#{pane_current_command},pi}" "send-keys M-d" "select-pane -R"  #= move pane right (pi pane: delegate picker)
bind -n M-Up    select-pane -U
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Right select-pane -R

# Resize -- shift+WASD
bind -n M-W resize-pane -U 3  #= grow pane up
bind -n M-A resize-pane -L 5  #= grow pane left
bind -n M-S resize-pane -D 3  #= grow pane down
bind -n M-D resize-pane -R 5  #= grow pane right
bind -n M-S-Up    resize-pane -U 3
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Down  resize-pane -D 3
bind -n M-S-Right resize-pane -R 5

# Autotiling split: one key, direction chosen from the pane's shape
bind -n M-e run-shell "~/.config/tmux/smart-split.sh split"  #= split pane
bind -n M-z resize-pane -Z  #= zoom pane
bind -n M-- display-popup -E -w 70% -h 60% -d "#{pane_current_path}"  #= scratch shell
bind -n M-x confirm-before -y -c x -p "close pane #P? (enter or x = yes)" kill-pane  #= close pane
bind -n M-v swap-pane -D  #= swap pane with next

# Merge another window in as a pane, direction chosen the same way
bind -n M-f choose-window -Z "run-shell '~/.config/tmux/smart-split.sh join %%'"  #= merge window into this one
bind -n M-b if-shell -F "#{==:#{pane_current_command},pi}" "send-keys M-b" "break-pane"  #= pane out to new window (pi: live bash output)

# Windows
bind -n M-t new-window -c "#{pane_current_path}"  #= new window (same dir)

# Sessions
bind -n M-c if -F "#{==:#{pane_current_command},pi}" "send-keys M-c" "display-popup -E -w 70% -h 60% "~/.config/tmux/session-picker.sh""  #= (pi pane: context preview)
bind -n 'M-`' switch-client -l  #= last session (toggle)
bind -n M-q previous-window  #= previous window
bind -n M-r next-window  #= next window
bind -n M-, swap-window -t -1  #= move window left
bind -n M-. swap-window -t +1  #= move window right
bind -n M-1 select-window -t 1  #= window 1
bind -n M-2 select-window -t 2  #= window 2
bind -n M-3 select-window -t 3  #= window 3
bind -n M-4 select-window -t 4  #= window 4
bind -n M-5 select-window -t 5  #= window 5
bind -n M-6 select-window -t 6  #= window 6
bind -n M-7 select-window -t 7  #= window 7
bind -n M-8 select-window -t 8  #= window 8
bind -n M-9 select-window -t 9  #= window 9

# Move the focused pane to window N (i3 move-to-workspace). Last pane in a
# window takes the window with it. Focus stays put.
bind -n M-S-1 run-shell '~/.config/tmux/send-pane.sh 1 #{pane_id}'  #= move pane to window 1
bind -n M-S-2 run-shell '~/.config/tmux/send-pane.sh 2 #{pane_id}'  #= move pane to window 2
bind -n M-S-3 run-shell '~/.config/tmux/send-pane.sh 3 #{pane_id}'  #= move pane to window 3
bind -n M-S-4 run-shell '~/.config/tmux/send-pane.sh 4 #{pane_id}'  #= move pane to window 4
bind -n M-S-5 run-shell '~/.config/tmux/send-pane.sh 5 #{pane_id}'  #= move pane to window 5
bind -n M-S-6 run-shell '~/.config/tmux/send-pane.sh 6 #{pane_id}'  #= move pane to window 6
bind -n M-S-7 run-shell '~/.config/tmux/send-pane.sh 7 #{pane_id}'  #= move pane to window 7
bind -n M-S-8 run-shell '~/.config/tmux/send-pane.sh 8 #{pane_id}'  #= move pane to window 8
bind -n M-S-9 run-shell '~/.config/tmux/send-pane.sh 9 #{pane_id}'  #= move pane to window 9

# Same keys as the plain shifted digit, for terminals that send that instead.
# bind-key (not "bind -n") keeps these out of the alt+space list.
bind-key -n 'M-!' run-shell '~/.config/tmux/send-pane.sh 1 #{pane_id}'
bind-key -n 'M-@' run-shell '~/.config/tmux/send-pane.sh 2 #{pane_id}'
bind-key -n 'M-#' run-shell '~/.config/tmux/send-pane.sh 3 #{pane_id}'
bind-key -n 'M-$' run-shell '~/.config/tmux/send-pane.sh 4 #{pane_id}'
bind-key -n 'M-%' run-shell '~/.config/tmux/send-pane.sh 5 #{pane_id}'
bind-key -n 'M-^' run-shell '~/.config/tmux/send-pane.sh 6 #{pane_id}'
bind-key -n 'M-&' run-shell '~/.config/tmux/send-pane.sh 7 #{pane_id}'
bind-key -n 'M-*' run-shell '~/.config/tmux/send-pane.sh 8 #{pane_id}'
bind-key -n 'M-(' run-shell '~/.config/tmux/send-pane.sh 9 #{pane_id}'

# Scrollback, session
bind -n M-g copy-mode -u  #= scrollback
bind -n M-F copy-mode \; command-prompt -p "search up:" "send -X search-backward '%%'"  #= search scrollback
bind -n M-G run-shell '~/.config/tmux/copy-scrollback.sh "#{pane_id}"'  #= copy whole scrollback to clipboard
bind -n M-V run-shell -b '~/.config/tmux/paste-image.sh "#{pane_id}"'  #= paste clipboard image into ssh pane (as a file path)
bind -n M-Q detach-client  #= detach
bind -n M-C run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh  #= save session snapshot now
bind -n M-R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"  #= reload config
bind -n M-E display-popup -E -w 90% -h 90% \
  "\${EDITOR:-nvim} ~/.tmux.conf && tmux source-file ~/.tmux.conf && tmux display-message 'tmux.conf reloaded'"  #= edit keybinds

# ── Status bar: show the keys so you never have to recall them ────────────
set -g status-interval 5
set -g status-style "bg=#3B4252,fg=#D8DEE9"
set -g status-left  " #[bold]#S#[nobold] "
set -g status-left-length 30
set -g status-right "#[fg=#81A1C1]#{?#{>:#{window_panes},1},alt+wasd pane · alt+z zoom · alt+x close · ,}alt+e split · alt+space = all keys "
set -g status-right-length 90
setw -g window-status-current-style "bg=#81A1C1,fg=#2E3440,bold"
setw -g window-status-format         " #I:#W#{?window_activity_flag,#[fg=#EBCB8B] •#[default],} "
setw -g window-status-current-format " #I:#W "
set -g pane-active-border-style "fg=#81A1C1"
set -g pane-border-style "fg=#4C566A"

# ── which-key style popup: Alt+Space ─────────────────────────
# Every row is live: press the letter shown to run it. Esc/q closes.
# NOTE: menu rows must have a real key AND command -- an empty pair crashes tmux.
bind -n M-Space display-popup -E -w 80% -h 70% \
  "~/.config/tmux/tmux-keys.sh"  #= command finder


# ── Persistence across reboots (resurrect + continuum) ────────────────────
# Continuum snapshots every 15 min and restores automatically the first time a
# tmux server starts -- i.e. when the first kitty window opens. Processes do NOT
# survive: what comes back is sessions, windows, panes, layouts, working dirs,
# window names, plus a restart of the whitelisted programs below.
set -g @resurrect-dir '/home/bocaj/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'nvim vim less man tail htop btop watch'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'


run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux

# Extended keys (modified Enter etc.) for TUI apps like pi
set -g extended-keys on
