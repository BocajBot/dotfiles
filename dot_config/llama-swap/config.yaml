  # ROLE: search/retrieval agent eval, added 2026-07-09. Harness-1 is a
  # 20B model merged into openai/gpt-oss-20b and trained for search-agent
  # behavior. The quant card exposes one Q4_K_M GGUF (15.8GB) with metadata
  # context_length=131072, but this host already runs a persistent reranker
  # and the full 131k KV would be risky without a load test. Start at 64k
  # dual-GPU layer split; raise only after checking llama-swap logs for
  # allocation warnings.
  # 2026-07-09: batch-size 32768/ubatch-size 2048 (initial starter values)
  # caused a live OOM (vk::Device::allocateMemory ErrorOutOfDeviceMemory)
  # decoding a normal 1845-token prompt - compute buffers scale with
  # batch-size regardless of actual prompt length, so the oversized batch
  # reserved VRAM as if every request were 32768 tokens. The first reduction
  # to 2048/512 still OOM'd during a later decode, so the live config now uses
  # 1024/256 to match available headroom (6900XT ~3GB free, 4060 ~1.5GB free
  # with reranker resident).
  harness-1-q4-k-m:
    name: "Harness-1 20B Q4_K_M - Search, Retrieval"
    description: "GPT-OSS-20B search/retrieval agent finetune. 64k ctx starter config."
    cmd: |
      llama-server
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/ijohn07/harness-1-Q4_K_M-GGUF/harness-1-q4_k_m.gguf"
      --alias harness-1-q4-k-m
      --device Vulkan0,Vulkan1
      --split-mode layer
      --parallel 1
      --ctx-size 65536
      --cache-type-k q8_0
      --cache-type-v q8_0
      # 2026-07-09: 2048/512 still OOM'd during a normal 1845-token decode
      # (Vulkan tried to allocate 1.36GB after the model was already loaded).
      # 1024/256 preserves the 64k context while cutting compute-buffer
      # pressure on the 6900XT/4060 split; prompt throughput is preferable to
      # an intermittent failed request.
      --batch-size 1024
      --ubatch-size 256
      -ngl all
      -fa on
      --jinja
      --chat-template-file /home/bocaj/.config/llama-swap/templates/openai-gpt-oss-120b.jinja
      # Harness-1 emits GPT-OSS channel markers but omits the parser-visible
      # terminator after llama.cpp strips the stop token; PEG parsing otherwise
      # turns valid JSON responses into HTTP 500s. This alias is used for
      # retrieval JSON, not native tool-call dispatch, so return raw content.
      --skip-chat-parsing
      --temp 1.0
      --top-p 1.0
      --top-k 0
      --min-p 0.01
      --cache-ram 8192
      -fit off

