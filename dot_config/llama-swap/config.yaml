  # Measurement history: models/CONFIG-HISTORY.md (Kimi-Linear-48B-A3B-Instruct-Q3_K_M)
  # SAMPLING PROVENANCE 2026-08-25: moonshotai's card publishes NO sampling
  # parameters - checked, it is silent, not missed. Values here (temp 0.6,
  # top_p 0.95, top_k 20, min_p 0.0) are a local choice with no card to defer
