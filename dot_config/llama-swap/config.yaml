  # produce.
  # ==> BIGGEST UNCLAIMED WIN IN THIS FILE. ctx 16384, --cache-type-v q4_0 and
  # the "~17 tok/s ceiling" were ALL dual-GPU compromises: the ceiling was
  # dense-split GPU->GPU serialization per token, which no longer happens. Left
  # unchanged pending measurement (CONFIG-AUDIT-20260806.md section C).
  # 2026-08-06 MEASURED at 65536 on the single card. Sits at 24130 MiB = 98% of
  # the 24560 MiB card - the tightest fit in this file. Near-limit VALIDATED: a
  # 60000-token prefill completed with no hang, no reset, no allocation failure
