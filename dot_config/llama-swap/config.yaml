      --top-p 0.95
      --top-k 0
      --min-p 0.0
      --cache-ram 8192
      -fit off

  # 2026-09-19: Bonsai 2 27B, PrismML ternary (PQ2_0, 2.13 bpw, 6.7 GiB) of
  # Qwen3.8-27B. PQ2_0/PTQ1_0 are PrismML fork ggml types with a Hadamard
  # activation runtime; since 2026-10-02 the PrismML prism branch (2459f68b5) is
  # merged into unified (70998af49), so this entry runs ${llama_server} like the
  # rest (greedy output identical to the old llama.cpp-prismml build, 58 t/s).
  # Originally run from that fork (commit 9a9394a). Verified on this box: test-backend-ops MUL_MAT_HADAMARD
  # 27/27 + 88 PQ2_0/PTQ1_0 MUL_MAT cases OK on ROCm0; llama-bench 7900 XTX
  # PQ2_0 pp512 547 / tg128 59.8 t/s, PTQ1_0 783 / 39.5 (6900 XT: 327/42.2,
  # 362/38.2). PQ2_0 chosen: +50% decode over PTQ1_0 on the XTX. Thinking on
  # by default (model card: benchmarks are thinking-mode; sampling temp 1.0
  # top-p 0.95 top-k 20 carried in GGUF metadata). Logs in ~/moe-opt-work/bonsai-*.
  Ternary-Bonsai-2-27B-PQ2_0:
    aliases:
      - bonsai-2-27b
      - ternary-bonsai-2-27b
    name: "Ternary-Bonsai-2-27B PQ2_0"
    description: "Role/flags: 2.13 bpw ternary; XTX only. PrismML ternary (1.72 bpw ideal) pack of Qwen3.8-27B, 6.7 GiB weights, runs on the PrismML llama.cpp fork. Thinking on by default; request ID bonsai-2-27b:nothink for non-thinking off the same loaded process. Capability not screened. Speed 2026-09-30 (n=3, median [range], tok/s): decode 58 [58-58]; at 32K context: prefill 429 [426-431], decode 51 [51-51]; load 4 s."
    filters:
      stripParams: "temperature,top_p,top_k,min_p,presence_penalty,repetition_penalty"
      # Reasoning levels live HERE, one loaded process. The chat template
      # (froggeric since 2026-10-05, default medium) accepts reasoning_effort xhigh | medium | low; llama-server
      # maps the OpenAI reasoning_effort body field into chat_template_kwargs
      # and treats "none" as enable_thinking=false. A client may send
      # reasoning_effort directly on the canonical id (pi does, via its
      # thinkingLevelMap -> compat.supportsReasoningEffort on the ONE pi entry
      # bonsai-2-27b), or pick a fixed level by request id below. The model
      # card says low behaves close to xhigh.
      setParamsByID:
        "bonsai-2-27b:xhigh":
          reasoning_effort: xhigh
        "bonsai-2-27b:medium":
          reasoning_effort: medium
        "bonsai-2-27b:low":
          reasoning_effort: low
        "bonsai-2-27b:nothink":
          reasoning_effort: none
          temperature: 0.7
          top_p: 0.80
          presence_penalty: 1.5
          min_p: 0.0
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/prism-ml/Ternary-Bonsai-2-27B-gguf/Ternary-Bonsai-2-27B-PQ2_0.gguf"
      --mmproj "/home/bocaj/models/prism-ml/Ternary-Bonsai-2-27B-gguf/Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf"
      --alias Ternary-Bonsai-2-27B-PQ2_0
      --device ROCm1
      --parallel 1
      --ctx-size 131072
      --batch-size 2048
      --ubatch-size 512
      -ngl all
      -fa on
      --jinja
      --chat-template-file /home/bocaj/.config/llama-swap/templates/qwen38-froggeric.jinja
      --reasoning-budget -1
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.05
      --presence-penalty 0.0
      --repeat-penalty 1.0
      -fit off

  # Historical IQ4_NL speed profile measured 2026-09-26: ROCm1,ROCm0 (7900 XTX, 6900 XT), layer
  # split 3:1; contiguous CPU prefix --n-cpu-moe 18 (block IDs 0-17; 17 MoE
  # layers because block 0 is dense); 32K context; q4_0 KV; --no-host.
  # Direct run: load 23.31s; 22-token prompt 25.05 tok/s; 256-token decode
  # 18.82 tok/s. Model buffers: CPU 11,532 MiB, CPU_REPACK 7,344 MiB, ROCm0
  # 13,657 MiB, ROCm1 23,491 MiB. At this run, display 6900 XT retained
  # ~1.66 GiB VRAM; non-display XTX retained ~87 MiB. q4 KV lowers cache
  # precision; no quality comparison has been run. Keep chat group exclusive.
  # --no-host avoids Vulkan_Host pinning CPU experts through global Vulkan0,
  # which caused amdgpu context loss in an earlier profile.
  # Imatrix has 8,578,890 routes per MoE layer; low-share blocks
  # 1,2,3,5,6,7,8,9,10,13,14,17,19,26,28,31,32,34,35 were tested as CPU layers.
  # At matched 32K/q8/256-token settings, that imatrix selection scored
  # 17.658 tok/s vs 17.805 for the contiguous prefix, with identical buffers.
  # Keep prefix: experts are packed by layer, and imatrix placement did not win.
  # IQ3_XXS A/B at 32K/q4_0, 22-token prompt, 256-token decode: n-cpu-moe 17
  # prefix scored 22.683 tok/s; imatrix-hot CPU blocks scored 21.907 tok/s.
  # Matched direct test with n-cpu-moe 10, split 2.9:1.1, and explicit 8
  # threads reached 28.667 tok/s (14.95s startup, 36.313 tok/s prompt).
  # The exact config omits thread flags; llama.cpp auto-selected 8 threads and
  # Both ncpu10 tests used buffers: CPU 7,639 MiB, ROCm0 11,119 MiB, ROCm1
  # 23,470 MiB. Display 6900 XT had 4.28 GiB free on exact-config run; XTX
  # had 96 MiB free in explicit-thread run and 0.04 GiB free with auto threads.
  # Explicit-thread cgroup peak 16,390 MiB / 3,906 high events; exact-config
  # auto-thread peak 15,737 MiB / zero high events. Both had zero max/OOM events
  # under MemoryHigh=16 GiB, MemoryMax=20 GiB, and group OOM kill.
  # An approved n-cpu-moe 8 / 2.5:1.5 experiment reached 30.981 tok/s
  # (15.07s startup, 47.073 tok/s prompt), with 32K configured, 22 prompt
  # tokens, and 256 decoded tokens. Buffers: CPU 5,995 MiB, ROCm0 15,513 MiB,
  # ROCm1 20,719 MiB; cgroup peak 16,390 MiB and no max/OOM events. Display
  # 6900 XT had only 88 MiB free while loaded, below the 1.5 GiB
  # reserve; do not configure this split. The approved n-cpu-moe 8 / 2.7:1.3
  # trial reached 30.832 tok/s (15.06s startup, 43.832 tok/s prompt) with the
  # same short prompt and output length. Buffers: CPU 5,995 MiB, ROCm0
  # 12,883 MiB, ROCm1 23,350 MiB. Display 6900 XT retained 2.55 GiB; XTX
  # retained 0.06 GiB. The 1.5 GiB display gate passed before inference.
  # Cgroup peak 16,390 MiB, 7,340 high events, max/OOM counters zero. Keep
  # this tested n-cpu-moe 8 / 2.7:1.3 profile configured. Long-context
  # throughput and quality remain unmeasured.
  Laguna-S-2.1-UD-IQ3_XXS:
    aliases:
      - laguna-s21
    name: "Laguna-S-2.1 UD-IQ3_XXS"
    description: "Role/flags: ROCm split 2.7:1.3. Unsloth Laguna-S-2.1 UD-IQ3_XXS weights. ROCm layer split across 7900 XTX and 6900 XT; CPU expert tensors stay in system RAM. Tested profile uses an 8-layer CPU expert prefix, q4_0 KV cache, and retains 2.55 GiB on the display GPU. Speed 2026-09-30 (n=3, median [range], tok/s): decode 29 [29-29]; at 32K context: prefill 404 [403-404], decode 25 [25-25]; load 17 s."
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/unsloth/Laguna-S-2.1-GGUF/UD-IQ3_XXS/Laguna-S-2.1-UD-IQ3_XXS.gguf"
      --alias Laguna-S-2.1-UD-IQ3_XXS
      --device ROCm1,ROCm0
      --tensor-split 2.7,1.3
      --split-mode layer
      --load-mode none
      --no-host
      # 2026-10-01: n-cpu-moe 8 -> 10 for ctx 32768 -> 65536 (8 OOM'd the XTX on a 16K prompt even at 32K ctx; 10 = 65K needle PASS).
      --n-cpu-moe 10
      --parallel 1
      --ctx-size 65536
      --cache-type-k q4_0
      --cache-type-v q4_0
      --batch-size 1024
      --ubatch-size 256
      -ngl all
      -fa on
      --jinja
      --temp 1.0
      --top-p 1.0
      --top-k 0
      --min-p 0.0
      --cache-ram 1024
      -fit off

groups:
  # chat: one exclusive group for every entry that can occupy most of the XTX
  # (or is unmeasured). exclusive:true is the failed-allocation guard - a new
  # member evicts whatever is resident, including the reranker on the other
  # card. Membership is load-bearing, not tidiness: an unmeasured entry joins
  # here first and only leaves once a measured footprint says it can co-reside.
  # Per-member sizing notes were moved to models/CONFIG-HISTORY.md (groups).
  chat:
