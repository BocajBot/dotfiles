  # ==================================================================
  # Added 2026-08-12. NEVER LAUNCHED - see the UNVALIDATED block below.
  # Backup: config.yaml.bak-2026-08-12-pre-nemotron
  # ==================================================================
  #
  # NVIDIA Nemotron 3.5 Lightning 30B-A3B (unsloth GGUF, released 2026-08-11).
  # Hybrid architecture: interleaved Mamba-2 + MoE with a few Attention layers,
  # 30B total / 3B active, trained ctx 1048576.
  #
  # >> UNVALIDATED. This entry was written from the model card and from static
  # >> inspection of the binary ONLY. It has NOT been loaded, not smoke-tested,
  # >> not benchmarked, not eval-scored - the session that added it was told not
  # >> to touch the GPU. Every number below is a PREDICTION. Watch GTT on the
  # >> first launch: a prediction this far out can land in the multi-GiB spill
  # >> band, which is a large silent decode loss.
  #
  # Architecture, quant rationale and the predicted ~22.7-23.2 GiB total are in
  # CONFIG-HISTORY - all of it arithmetic from GGUF metadata, none of it measured.
  # The one thing to carry into the first run: 46 of 53 blocks are Mamba-2, whose
  # SSM kernels exist in the Vulkan backend but are UNCONFIRMED on gfx1100. If
  # they fall back to CPU, host memory goes into the GTT spill band.
  #
  # NO --n-cpu-moe:  # NO --n-cpu-moe: weights are meant to be fully resident, and the default is
  # already 0. Do not add a non-zero depth to "make room" - moe depth is the
  # one variable that drove GTT into the crash band (gpu-hard-reset memory).
  # NO --no-mmap: full-GPU-offload entry, same rule as devstral/gemma/glm.
  #
  # Sampling is the card's recommendation (temp 1.0, top_p 0.95). Reasoning is
  # left at the template's own default (enable_thinking=True).
  # REVERTED 2026-08-25: found on build-rocm with --device ROCm1 and q8_0/q8_0
  # KV; restored to the distro binary, Vulkan0 and f16/f16 KV as recorded
  # below. Source of that edit unknown. This entry has still NEVER BEEN RUN,
  # so neither state was ever validated - re-measure before trusting either.
  # Backup of the found state: config.yaml.bak-2026-08-25-pre-muse-nemotron-revert
  # SAMPLING CARD-CONFORMANT 2026-08-25 (nvidia Nemotron 3.5 Lightning):
  # temperature 1.0, top_p 0.95. The card is silent on top_k/min_p, so those are
  # deliberately unset and llama-server's defaults apply - do not read the
  # absence as an oversight.
  NVIDIA-Nemotron-3.5-Lightning-30B-A3B-MXFP4_MOE:
    aliases:
      - nemotron-3-5-lightning-30b-a3b
    name: "Nemotron 3.5 Lightning 30B-A3B MXFP4 (Mamba-2/MoE hybrid) - UNTESTED, never launched, no eval, no measured tok/s - added 2026-08-12 - 64K ctx"
    description: "NVIDIA Nemotron 3.5 Lightning, 30B total / 3B active, interleaved Mamba-2 + MoE + attention. Added from the model card WITHOUT being run: no capability score, no safety score, no tok/s, no confirmed VRAM fit. It carries none of the [DEL x/3, INJ-*] tags the rest of this lineup carries because nothing has been measured - absence of a hazard tag here means UNTESTED, not safe. Assume every hazard in the lineup until it is screened. First launch must be attended."
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-MXFP4_MOE.gguf"
      --alias NVIDIA-Nemotron-3.5-Lightning-30B-A3B-MXFP4_MOE
      --device Vulkan0
      --split-mode none
      --parallel 1
      # 65536 = the Hermes floor exactly, against a trained 1048576.
      # Deliberately from below. KV here is genuinely cheap - 7.00 KiB/token,
      # so 256K would cost only 1.75 GiB and the full 1M window 7.0 GiB - so a
      # much larger window looks affordable on paper (this is how kimi-linear
      # ended up at 262144). Do NOT raise it on that arithmetic alone: nothing
      # has loaded this model yet, and raising ctx moves the box to an untested
      # operating point. Measure at 64K first, then raise.
      --ctx-size 65536
      # f16/f16. Not forced - unlike kimi-linear (whose 72-wide value head
      # cannot take q8_0 at all), this model's heads are 128 wide and would
      # divide q8_0's 32-element block cleanly. f16 is chosen because KV is
      # only ~0.44 GiB at this ctx, so quantising it would buy ~0.2 GiB and
      # add an untested variable to an entry that has never been run. If the
      # first attended run comes up short on VRAM, q8_0/q8_0 is the legal
      # lever - set BOTH, never a mismatched pair.
      --cache-type-k f16
      --cache-type-v f16
      --batch-size 2048
      --ubatch-size 512
      -ngl all
      # -fa on matches every other entry here; NOT verified for this arch.
      -fa on
      --jinja
      # Card gives temp/top-p only and is silent on top-k/min-p, so those are
      # deliberately NOT set - llama-server's own defaults (top-k 40,
      # min-p 0.05) stay active. Noted because every other sampling value in
      # this file is explicit; do not read the absence as an oversight.
      --temp 1.0
      --top-p 0.95
      -fit off

  # 2026-08-19: DFlash2 block-diffusion speculative decoding (PR #27342).
  # BINARY IS THE ISOLATED WORKTREE build-rocm2 (build 10505, commit 569944419)
  # = local-patches + 1 DFlash2 commit + 43 upstream commits. Production
  # entries stay on build-rocm; this entry is the ONLY user of build-rocm2.
  # Standing rule: do not merge dflash2-pr27342 into local-patches until
  # PR #27342 lands upstream. Notes: llama.cpp-dflash2/DFLASH2-NOTES.md
  #
  # The draft has no output.weight - it borrows the TARGET's, which lives in
  # the target's ROCm1 buffer. So the draft MUST be on ROCm1 too, or the
  # scheduler aborts at ggml-backend.cpp:930. --spec-draft-ngl 99 and
  # --spec-draft-device ROCm1 are load-bearing, not tuning.
  #
  # Measured 2026-08-19 @ ctx 8192, temp 0, n=3, same binary both arms:
  #   DFlash2 n-max 7: 75.5 t/s, draft 86/98 (88%)
  #   MTP     n-max 2: 58.5 t/s, draft 65/72  => +29% decode
  #   greedy output byte-identical to MTP (lossless claim holds)
  # ctx starts at 65536 deliberately - 131072 would put target+draft near 96%
  # of the XTX. Raise only after a measured VRAM reading, from below.
  # 2026-08-28: REPLACES the two UD-Q4_K_XL entries (removed same day) and
  # inherits their aliases, so Pi and Hermes keep working unchanged.
  # Q4_1 vs UD-Q4_K_XL, measured (~/llama-swap-work/q4quant-ab/RESULTS.md):
  # identical quality - wikitext PPL 6.9939 vs 6.9942, paired per-chunk
  # t = -0.05 over 580 chunks - but 29% faster served, because speculative
  # verification runs the target at small batch where Q4_1's kernels beat
  # this mixed k-quant (pp4 +38%, pp8 +68%; at pp16 the ranking INVERTS, so
  # re-measure before raising the draft block much further).
  #
  # --spec-draft-n-max 5, not 3: n-max trades prose for code. Measured at
  # ctx 262144, prose/code t/s - 3: 57.5/80.4, 4: 55.2/89.7, 5: 52.5/96.3,
  # 6: 49.0/98.6. This box is used mostly for coding, and 5 is the best
  # mixed setting (highest mean); 6 buys only 2.4% more code for another 7%
  # off prose. DFlash2 beats the model's own MTP head at every n-max tried
  # (MTP n-max 5: 49.1/81.8), so draft-mtp is NOT used despite needing no
  # drafter file.
  #
  # filters (llama-swap v251): stripParams drops client-sent sampling so the
  # card profile below actually applies - Open WebUI and OpenCode both send
  # their own. setParamsByID serves thinking and non-thinking as separate
  # request IDs from ONE loaded process, verified: one model load answers
  # both, no swap.
  Qwen3.8-27B-Q4_1:
    aliases:
      - qwen3-8-27b
      - qwen3-8-27b-q4-1
    name: "Qwen3.8 27B Q4_1 + DFlash2 draft - CODING DAILY - 256K ctx, KV q4_0, 2-GPU split"
    description: "Qwen3.8-27B at Q4_1, tuned for coding (--spec-draft-n-max 5: 96 t/s on code, 53 on prose). Equal perplexity to UD-Q4_K_XL, which it replaced. Non-thinking by default; request ID qwen3-8-27b:think for the thinking profile off the same loaded process. Capability not screened."
    filters:
      stripParams: "temperature,top_p,top_k,min_p,presence_penalty,repetition_penalty"
      setParamsByID:
        "qwen3-8-27b:think":
          temperature: 1.0
          top_p: 0.95
          chat_template_kwargs:
            enable_thinking: true
        "qwen3-8-27b-thinking":
          temperature: 1.0
          top_p: 0.95
          chat_template_kwargs:
            enable_thinking: true
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q4_1.gguf"
      --mmproj "/home/bocaj/models/unsloth/Qwen3.8-27B-GGUF/mmproj-BF16.gguf"
      -md "/home/bocaj/models/z-lab/Qwen3.8-27B-DFlash2-GGUF/Qwen3.8-27B-DFlash2-Q4_K_M.gguf"
      --alias Qwen3.8-27B-Q4_1
