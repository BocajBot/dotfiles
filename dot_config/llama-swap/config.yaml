  # (still on disk, unused). NOTE the package is b10221, SLIGHTLY OLDER than
  # the b10252 the benchmarks below were run on - re-measure before comparing.
  # Validated 2026-08-03 at the FULL window (65480-token prompt + 24 gen =
  # 65504/65536 cells, clears Hermes 64K floor): loader reports 65536 cells /
  # 44 layers (q8_0 KV 5984 MiB), needle retrieval PASS on Q8 and Q4, no
  # GGML_ASSERT / no compute-buffer failures.
  # Bench vs port baseline (same harness, fresh port per run): Q8 gen
  # 56.7-58.0 vs 55.2-56.1 t/s, pp8000 ~968 vs ~970, pp32000 403 vs 404 --
  # parity or slightly better on all axes.
  # HIP + TheRock ROCm 7.15 build of the SAME commit (build-hip-therock):
  # pp8000 1410, pp32000 641 t/s (1.5-1.6x Vulkan prefill) BUT gen 48.9 vs 57
  # -- rejected for prod (gen-AND-prefill gate). Candidate for TTFT-bound
  # workloads only; binary needs LD_LIBRARY_PATH to TheRock libs under
  # ~/Documents/nanbeige45-train/.venv-rocm7 (sonames otherwise resolve to
  # system /opt/rocm 7.2.4).
  # QUANTS PROMOTED TO BARTOWSKI 2026-08-04 (user decision after the 6-way
  # regression grade, models/CONFIG-HISTORY.md nanbeige4.2-3b section):
  # Q8_0 tensors are byte-equivalent to owao's (Q8_0 ignores the imatrix; the
  # eval flipped the same 9/810 MC items for both) so the Q8 swap is
  # provenance-only. Q4_K_M is the real change: bartowski imatrix drifts less
