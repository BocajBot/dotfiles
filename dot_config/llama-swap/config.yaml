  # 0.6, top_p 0.95, top_k 20. Previously NO sampling flags at all, so it ran on
  # llama-server defaults (temp 0.8, top_k 40, min_p 0.05) - off-card by
  # omission rather than by decision.
  # 2026-08-26 TTFT MEASURED (cold, cache-busted, n=3): 60 ms @16 tok, 854 ms
  # @2K, 5.06 s @8K, 51.0 s @32K, 719 s @146,321 tok (n=1). Prefill decays
  # 2343 -> 1582 -> 628 -> 203 t/s with depth, so TTFT is STRONGLY SUPERLINEAR -
  # never scale a shallow number to estimate a deep one. Q4_K_M measures the same
  # at every depth: weight quant does NOT buy TTFT here, only VRAM. Cache hits
  # are 22-84 ms at any depth. CONSEQUENCE: the 262144 ctx below is for
  # cache-warm incremental conversation, NOT one-shot deep documents - a cold
  # 146K prefill is 12 minutes, so any harness feeding this a long document cold
  # needs a tens-of-minutes timeout or it reads as a hang.
  # Full table: ~/llama-swap-work/ttft-nanbeige-2026-08-26.md
  # 2026-08-26 XTX PLACEMENT VERIFIED. `--device Vulkan0` = 7900 XTX (backends
  # enumerate opposite to rocm-smi: Vulkan0/ROCm1 = XTX, Vulkan1/ROCm0 = 6900
