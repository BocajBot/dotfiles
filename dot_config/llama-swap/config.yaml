  # ==========================================================================
  # 2026-08-23: Muse Glimmer 30B (meta-models). Dense 52-layer vision model,
  # GQA kv_head=2/head_dim=128, sliding_window 2048 with pattern 4 (3 local :
  # 1 global), native ctx 131072, rope_theta 5e5. Reasoning model - opens the
  # assistant turn with a <think> block; the seam parses clean into
  # reasoning_content under --jinja (checked, both text and image turns).
  # FIT IS MEASURED, NOT PREDICTED (single load, ctx 131072, KV q8_0/q8_0):
  #   weights UD-Q4_K_XL 14.79 + mmproj Q8_0 1.91 + KV 0.90 = 17.60 GiB
  #   accounted; rocm-smi showed 19.46 GiB on the XTX, so ~1.9 GiB is Vulkan
  #   graph/compute overhead at batch 2048 / ubatch 512 with the vision tower.
  #   4.5 GiB free, GTT 1.00 (the constant Vulkan host-visible overhead, not
  #   spill). Warm decode 44.4 tok/s.
  # The KV is cheap because only 13 of 52 layers are global: 13 x 544 B/token
  # = 7,072 B/token x 131072 = 0.86 GiB, and the 39 SWA layers are pinned at
  # the 2048-token window (~0.04 GiB total). Raising ctx is NOT the same lever
  # here as on a dense-global model - but 131072 is the trained maximum, so
  # there is nothing to raise it to.
  # QUANT CHOICE: Q5_K_M (+3.3 GiB over Q4_K_XL) lands at ~22.8 GiB of 23.98
  # with the projector resident. That is inside the band where gemma's Q5_K_XL
  # A/B lost 15-20% decode for zero headroom. Not attempted. If it is ever
  # tried, --no-mmproj-offload first and re-measure, do not assume.
  # Vendor sampling: temperature 1.0 (README). No top_p/top_k published.
  # SAMPLING CARD-CONFORMANT 2026-08-25 (meta-models/Muse-Glimmer-30B):
  # temperature 1.0. The card publishes no top_p/top_k, so those are left unset.
  Muse-Glimmer-30B-UD-Q4_K_XL:
    aliases:
      - muse-glimmer-30b
    name: "Muse-Glimmer-30B UD-Q4_K_XL"
    description: "meta-models Muse Glimmer 30B, dense 52-layer vision reasoner at 131072 native ctx. Fit and speed are measured; CAPABILITY AND SAFETY ARE NOT - it has not been through the harness, so it has no tier score and no hazard profile. Do not hand it untrusted content or destructive tools until it has been scored like the rest of the lineup. Speed 2026-09-30 (n=3, median [range], tok/s): decode 44 [44-44]; at 32K context: prefill 764 [764-769], decode 42 [42-42]; load 10 s."
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/unsloth/Muse-Glimmer-30B-GGUF/Muse-Glimmer-30B-UD-Q4_K_XL.gguf"
      --mmproj "/home/bocaj/models/unsloth/Muse-Glimmer-30B-GGUF/mmproj-Muse-Glimmer-30B-Q8_0.gguf"
      --alias Muse-Glimmer-30B-UD-Q4_K_XL
      # Vulkan1 = RX 7900 XTX 24 GiB since the 2026-09-24 flip (was Vulkan0 when
      # verified 2026-08-23); re-verify before trusting the index (see header).
      # ROCm A/B REJECTED 2026-08-23. Paired run on the build-rocm binary (SAME
      # commit c5e36ac59 / build 10460, so backend is the only variable), same
      # flags, --device Vulkan0 -> ROCm1, 3 reps each:
      #   Vulkan0  44.32 / 44.36 / 44.46 tok/s
      #   ROCm1    37.02 / 37.02 / 37.13 tok/s
      # Non-overlapping: ROCm is ~17% slower. It also refused to stay on one
      # card - 2.65 GiB landed on GPU[0] (the 6900 XT) despite --device ROCm1,
      # because a HIP process takes a context on every visible card. That
      # silently occupies a card the exclusive `chat` group is meant to keep
      # clear for a neighbour. Two reasons to stay on Vulkan, not one.
      # NOTE this does NOT contradict the "dense GDN -> ROCm" rule from the
      # qwen3.5 work: Muse is dense CONVENTIONAL attention with a sliding
      # window, not gated delta-net. That rule is not in scope here.
      --device Vulkan1
      --split-mode none
      --parallel 1
      --ctx-size 131072
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 512
      -ngl all
      -fa on
      --load-mode none
      --jinja
      --temp 1.0
      --min-p 0.0
      --cache-ram 8192
      -fit off

  # Measurement history: models/CONFIG-HISTORY.md (Ornith-1.5-35B-Q4_K_M)
  # ==========================================================================
  # Ornith 1.5 35B-A3B (ornith-ai), added 2026-08-23. arch qwen35moe: 40
  # transformer layers + 1 MTP layer, 256 experts / 8 active, hybrid attention
  # (full_attention_interval 4 - only ~10 layers hold a growing KV cache, the
  # other 31 are linear with constant-size state). Native ctx 262144. Vision via
  # a qwen3vl_merger projector. Reasoning model (<think> by default).
  # MEASURED as configured: 16.57 GiB on the XTX + 11.15 on the 6900 XT, GTT
  # 0.09/0.02, 80 tok/s decode, 3014 tok/s prefill, needle found at 36K, vision
  # correct, seam parses clean. Derivation and the A/Bs are in the history.
  #
  # SINGLE-CARD DOES NOT FIT - that is why this is split, not a preference.
  # 20.22 weights + 0.84 mmproj + 2.66 KV at 262144 + ~2.0 graph = ~25.7 GiB
  # against 23.98 on the XTX. --no-mmproj-offload only reaches ~24.9; halving
  # ctx only reaches ~24.4. All three variants are over. Do not "simplify" this
  # back onto one card.
  # If 262144 ever stops fitting, drop BOTH KV types to q4_0 (halves the 2.66)
  # BEFORE cutting ctx.
  # KV MUST STAY MATCHED (q8_0/q8_0): on the qwen3.8-27B hybrid, mismatched or
  # q5_1 KV cost ~6x prefill; only matched q8/q8 or q4/q4 were fast.
  # LONG CONTEXT: 262144 is the trained window. The vendor documents YaRN factor
  # 4.0 for ~1M - deliberately NOT enabled, untested and it costs short-context
  # quality.
  # SAMPLING CARD-CONFORMANT 2026-08-25 (ornith-ai/Ornith-1.5-35B-A3B):
  # temperature 0.6, top_p 0.95, top_k 20 - the card's general-use profile. Its
  # temperature 1.0 is a benchmark-reproduction setting, not a recommendation.
  Ornith-1.5-35B-Q4_K_M:
    aliases:
      - ornith-1-5-35b-a3b
    name: "Ornith-1.5-35B Q4_K_M"
    description: "Role/flags: reasoner. ornith-ai Ornith 1.5 35B-A3B, hybrid-attention MoE (256 experts / 8 active) with vision, at the full 262144 native context across both cards. Fit and speed are MEASURED on ROCm, which won its backend A/B outright (16.57 GiB on the XTX + 11.15 on the 6900 XT, needle found at 36K, vision correct). CAPABILITY AND SAFETY ARE NOT: no harness run, so no tier score and no hazard profile. Do not hand it untrusted content or destructive tools until it has been scored like the rest of the lineup. Long-context behaviour is unverified above 36K of its 256K window. Speed 2026-09-30 (n=3, median [range], tok/s): decode 83 [82-84]; at 32K context: prefill 3396 [3384-3438], decode 53 [53-54]; load 9 s."
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/ornith-ai/Ornith-1.5-35B-A3B-GGUF/Ornith-1.5-35B-Q4_K_M.gguf"
      --mmproj "/home/bocaj/models/ornith-ai/Ornith-1.5-35B-A3B-GGUF/mmproj-Ornith-1.5-35B-BF16.gguf"
      --alias Ornith-1.5-35B-Q4_K_M
      # ROCm1 = RX 7900 XTX, ROCm0 = RX 6900 XT - the ROCm and Vulkan backends
      # enumerate in OPPOSITE order, see the file header. Re-verify with
      # --list-devices on THIS binary before trusting the indices.
      # ROCm IS THE MEASURED WINNER here (+28% decode, +124% prefill, lower GTT)
      # and that is why this entry runs the build-rocm binary. Hybrid-GDN -> ROCm
      # now holds for a third model, but it does NOT generalise - Muse Glimmer,
      # dense conventional attention, went the other way in its own A/B.
      # UNRESOLVED, n=1 each: decode at 36K depth was 51.2 tok/s on ROCm vs 55.5
      # on Vulkan, the only measurement where Vulkan led. Re-measure with reps
      # before treating deep-context decode as a reason to switch back.
      --device ROCm1,ROCm0
      --split-mode layer
      --main-gpu 0
      --tensor-split 0.60,0.40
      # NO MTP FLAGS, DELIBERATELY - this looks like an omission and is not.
      # The MTP layer IS native to this GGUF (blk.40.nextn.*,
      # nextn_predict_layers = 1) and every packager documents --spec-type
      # draft-mtp. It was measured and it LOSES on both backends (-2.5% Vulkan,
      # -16% ROCm): acceptance is only ~0.43 and the draft pass has to cross the
      # layer split. Do not re-add it on the strength of the model card, the
      # community default, or a single-card benchmark. If this is ever collapsed
      # onto one card, re-run the A/B first.
      --parallel 1
      --ctx-size 262144
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 512
      -ngl all
      -fa on
      --load-mode none
      --jinja
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
