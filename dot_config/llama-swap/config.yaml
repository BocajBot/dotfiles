  Kimi-Linear-48B-A3B-Instruct-Q3_K_M:
    aliases:
      - kimi-linear-48b-a3b-instruct
    name: "Kimi-Linear-48B-A3B-Instruct Q3_K_M"
    description: "Role/flags: long-context instruct; T0 weak:factual/tools. Largest model in the lineup, now its longest-context entry. Mid-pack capability (T3 67%, scored on Q4). RESISTS tool-result injection (its test failure was not completing the task, not obeying). Hazards: obeys document injection, deletes 1/3. Speed 2026-09-30 (n=3, median [range], tok/s): decode 157 [142-158]; at 32K context: prefill 1510 [1503-1512], decode 122 [122-123]; load 14 s."
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      # Q3_K_M, not Q4: Q3 is FULLY VRAM-RESIDENT where Q4 at -ngl 99 spilled
      # ~4 GiB to GTT, and multi-GiB GTT spill under sustained compute is this
      # box's freeze mode. Staying resident is a crash mitigation, not just a
      # speed choice. Q4 weights kept on disk for rollback.
      # KNOWN ANOMALY, unexplained and still unfixed: Q3 decode is ~2x SLOWER at
      # 64K-128K ctx (67 tok/s) than at 32K (150) or 256K (135). Reproduced
      # across interleaved processes; Q4 was flat (~39) at every ctx. Do NOT
      # "tune" ctx into the 64K-128K band without re-measuring.
      -m "/home/bocaj/models/bartowski/Kimi-Linear-48B-A3B-Instruct-GGUF/moonshotai_Kimi-Linear-48B-A3B-Instruct-Q3_K_M.gguf"
      --alias Kimi-Linear-48B-A3B-Instruct-Q3_K_M
      --device Vulkan1
      --split-mode layer
      -ngl 99
      --parallel 1
      # KV is NOT what constrains this entry; weights are. Only ~6 of 27 blocks
      # are MLA, so the cache is ~6.75 KiB/token - 262144 costs ~1.7 GiB.
      --ctx-size 262144
      # f16/f16 IS FORCED, not a tuning preference - do not "optimise" it.
      # Mismatched K/V is rejected at load:
      #   E llama_init_from_model: model does not support different K (q8_0)
      #     and V (f16) cache types
      # and q8_0 for BOTH also fails, because KDA's 72-wide value head is not a
      # multiple of q8_0's 32-element block:
      #   E V cache type q8_0 with block size 32 does not divide n_embd_head_v=72
      --cache-type-k f16
      --cache-type-v f16
      --batch-size 1024
      --ubatch-size 512
      -fa on
      --jinja
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      -fit off

  # (d) -fa on IS REQUIRED, do not "optimize" it away.
  #
  # Measurement history: models/CONFIG-HISTORY.md (Nanbeige4.2-3B-Q8_0)
  # SAMPLING CARD-CONFORMANT 2026-08-25 (Nanbeige/Nanbeige4.2-3B): temperature
  # 0.6, top_p 0.95, top_k 20. Previously NO sampling flags at all, so it ran on
  # llama-server defaults (temp 0.8, top_k 40, min_p 0.05) - off-card by
  # omission rather than by decision.
  # 2026-08-26 TTFT MEASURED (cold, cache-busted, n=3): 60 ms @16 tok, 854 ms
  # @2K, 5.06 s @8K, 51.0 s @32K, 719 s @146,321 tok (n=1). Prefill decays
  # 2343 -> 1582 -> 628 -> 203 t/s with depth, so TTFT is STRONGLY SUPERLINEAR -
  # never scale a shallow number to estimate a deep one. Q4_K_M measures the same
  # at every depth: weight quant does NOT buy TTFT here, only VRAM. Cache hits
  # are 22-84 ms at any depth. CONSEQUENCE: the 262144 ctx below is for
  # cache-warm incremental conversation, NOT one-shot deep documents - a cold
  # 146K prefill is 12 minutes, so any harness feeding this a long document cold
  # needs a tens-of-minutes timeout or it reads as a hang.
  # Full table: ~/llama-swap-work/ttft-nanbeige-2026-08-26.md
  # Two earlier readings that looked like defects were BOTH measurement
  # artifacts, recorded here so they are not re-chased:
  #   - "empty content" was probe-limited. This is a reasoner and emits
  #     ~2,300-2,900 chars of reasoning_content before any content; a 120-token
  #     probe returns finish_reason=length with content_len 0 and nothing is
  #     wrong. Give it >=600 completion tokens or it looks broken.
  #   - "23.5 GiB for a 3B" was taken mid-swap with the previous model still
  #     resident. Never read VRAM without an idle baseline in the same run.
  # The real footprint is arithmetic, not a defect: num_loops=2 doubles 22
  # blocks to 44 effective KV layers, and key/value_length are 128 (NOT
  # embedding/head_count = 64). 44 x 8 KV heads x 256 elem = 90,112 elem/token,
  # so q4_0 KV at 262144 = 12.4 GiB of cache alone. That is why this 3B costs
  # what a 30B costs. Do not "fix" it by cutting batch size - it is the cache.
  Nanbeige4.2-3B-Q8_0:
    aliases:
      - nanbeige4.2-3b
      - nanbeige4.2-3b-ttft
      - nanbeige4.2-3b-raw
    name: "Nanbeige4.2-3B Q8_0"
    description: "Role/flags: bartowski quant; distro llama-cpp b10221. Speed 2026-09-30 (n=3, median [range], tok/s): decode 91 [90-91]; at 32K context: prefill 742 [741-743], decode 57 [57-57]; load 3 s."
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/bartowski/Nanbeige_Nanbeige4.2-3B-GGUF/Nanbeige_Nanbeige4.2-3B-Q8_0.gguf"
      --alias Nanbeige4.2-3B-Q8_0
      --device Vulkan1
      --split-mode none
      --parallel 1
      # 2026-08-08: 131072 -> 262144 (trained max) with q4_0 KV (q8_0 KV @256K
      # = ~24 GiB, the crash-#3 spill; q4_0 halves it -> resident 16.9 GiB,
      # GATE PASS). 180K-depth: prefill 163 / decode 20.8. ttft + q4 entries
      # stay 131072/q8_0 KV on purpose - full-precision KV at normal depths.
      --ctx-size 262144
      --cache-type-k q4_0
      --cache-type-v q4_0
      --batch-size 4096
      --ubatch-size 1024
      -ngl all
      -fa on
      --jinja
      --temp 0.6
      --top-p 0.95
      --top-k 20

