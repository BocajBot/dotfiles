  # WHY A SEPARATE GROUP, NOT `utility`: moving it out of `chat` was not
  # enough. `chat` is exclusive:true, and an exclusive group unloads models in
  # OTHER groups too - measured: loading qwen3-8-27b-longctx dropped GPU[0]
  # from 13.2 GB back to 2.2 GB (desktop only) and /running listed the 27B
  # alone. Only `persistent: true` survives an exclusive group's swap-in.
  # SAFE TO PIN: the summarizer is the ONLY entry in this file whose --device
  # targets card 0 (every other entry is Vulkan1 or ROCm1, both the 7900 XTX),
  # so holding ~12.3 GiB of the 6900 XT permanently starves nothing.
  # THE POINT: Hermes compaction / title generation must stop evicting the
  # resident 27B - a reloaded model has an empty KV cache, which cost a full
  # ~46 s re-prefill of the 33K system prompt on the next user message.
  #
  # 2026-08-19: persistent true -> false. The premise above ("holding ~12.3 GiB
  # of the 6900 XT permanently starves nothing") no longer holds: card 0 is now
  # needed for the 27B's own layer split (--device ROCm0,ROCm1), which is what
  # buys 262144 ctx WITH MTP - the combination that OOMs on one card. A 4B
  # model at 256K ctx costing 12.3 GiB is too expensive for that role.
  # TODO: replace with a cheaper summarizer (smaller ctx is the lever; 256K is
  # far more than /compact needs). Until then compaction reloads on demand.
  summarizer:
    persistent: false
    swap: false
    exclusive: false
    members:
      - Qwen3.5-4B-Q8_0

