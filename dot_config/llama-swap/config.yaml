  # Qwen3.5 4B summarizer for Hermes /compact (context compression).
  # Uses Unsloth's recommended instruct (non-thinking) settings for Qwen3.5
  # Small: temp 0.7 / top_p 0.8 / top_k 20 / min_p 0.0 / presence_penalty 1.5 /
  # repetition_penalty 1.0. 4B means reasoning is OFF by default (matched the
  # sibling). MTP Q8_0 (4.6GB) has no MTP spec flags (same stance as
  # qwen3-5-4b). f16 KV to keep it fast for the size.
  # 2026-08-06: Vulkan1 -> Vulkan0. The original point of this entry was that it
  # sat on the idle 4060 and did NOT contend with the quality models - that is
  # no longer achievable on one card, AND it is a member of the exclusive `chat`
  # group, so a Hermes /compact call now EVICTS the loaded chat model and swaps
  # it back afterwards. Two full model loads per compaction. If that cost bites,
  # the fix is a config decision (drop it from the chat group and accept
  # co-residency, or point auxiliary.compression at a model already loaded), not
  # a flag change - see CONFIG-AUDIT-20260806.md E2.
  # Measurement history: models/CONFIG-HISTORY.md (Qwen3.5-4B-Q8_0)
  Qwen3.5-4B-Q8_0:
    aliases:
      - qwen3-5-4b-summarizer
    name: "Qwen3.5 4B Summarizer - /compact compression - Q8_0 - 163 tok/s ROCm+MTP - 256K ctx"
    description: "Dedicated context-compression/summarization model for Hermes /compact (auxiliary.compression). Instruct non-thinking per Unsloth recipe. 2026-08-08: Vulkan0 -> ROCm0 + dormant MTP head enabled = 62.7 -> 163-165 tok/s (2.6x), accept 74-76% (BENCH §5, dense-GDN rule, N=2). Old name claimed Vulkan1/32K - both were stale."
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/unsloth/Qwen3.5-4B-MTP-GGUF/Qwen3.5-4B-Q8_0.gguf"
      --alias Qwen3.5-4B-Q8_0
      # 2026-08-08: Vulkan0 -> ROCm0 + MTP (backup
      # config.yaml.bak-2026-08-08-pre-summarizer-rocm-ticketagentic-removal).
      # Measured this exact shape: vulkan-plain 62.7, rocm-plain 101.9 (+62%),
      # vulkan-mtp 82.3, rocm-mtp 163.3-164.6. Dense GDN -> ROCm rule (N=2:
      # this model + qwen3-6-27b, both +62% serving). llama-bench understates
      # MTP configs - A/B serving throughput before reverting.
      # 2026-08-17: ROCm1 (7900 XTX) -> ROCm0 (6900 XT). It shared a card with
      # the 27B chat models, and sharing the exclusive `chat` group meant every
      # Hermes title-generation / compaction call EVICTED the 27B - whose KV
      # cache then rebuilt from scratch, costing a full ~46 s re-prefill of the
      # 33K system prompt on the user's next message (verified: two Qwen3.8
      # load events, the second at the same second as a summarizer call).
      # Parked on the idle second card instead, and moved to the `utility`
      # group so it no longer evicts or is evicted.
      --device ROCm0
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --split-mode none
      --main-gpu 0
      --parallel 1
      # 2026-08-06: 32768 -> 65536 (Hermes 64K floor).
      # 2026-08-08: 65536 -> 262144 (trained max). Measured @262144: vram 14.81
      # GiB, GTT at idle (fully resident), short decode 160 tok/s, and at 125K
      # depth prefill 1399 / decode 118. GDN layers keep KV small; f16 KV stays
      # (fastest setting per quant-headroom audit). Data: thermal-data/ctx256k-*.
      # 2026-08-17, with the move to ROCm0: the 14.81 GiB measured at 262144
      # was on the 24 GiB 7900 XTX. The 6900 XT has 15.98 GiB and ~1.93 GiB of
      # that is already held by the desktop, leaving ~14.05 GiB - so 262144 at
      # f16 KV would NOT have fit. Quantising KV f16 -> q8_0 roughly halves it
      # (est. ~10.5 -> ~5.3 GiB at 262144), which brings the total to ~9.6 GiB
      # and lets the trained-max 262144 stay. Est. ~4.4 GiB headroom - well
      # clear, so this is still approaching the card from below.
      # KV MUST stay MATCHED (q8/q8 or q4/q4) - q5_x or mixed K/V falls off
      # the ROCm FA fast path, ~6x slower prefill (measured on qwen3-8-27b).
      # NOTE: quant-headroom-audit measured f16 as this model's FASTEST KV
      # setting, so q8 may cost decode speed - that trade was chosen knowingly
      # to fit the smaller card. Re-measure before assuming 163 tok/s holds;
      # this is also a different GPU arch (gfx1030 RDNA2, not gfx1100).
      --ctx-size 262144
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 512
      -ngl all
      -fa on
      --jinja
      --chat-template-kwargs '{"enable_thinking":false}'
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0.0
      --presence-penalty 1.5
      --repeat-penalty 1.0
      --cache-ram 8192
      -fit off
    filters:
      stripParams: "presence_penalty,repetition_penalty"

