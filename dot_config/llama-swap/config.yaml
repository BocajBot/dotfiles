# Chat models swap among themselves; the reranker is never evicted by them.
# Add any NEW chat model to the "chat" members list.
groups:
  chat:
    swap: true
    exclusive: true
    members:
      - qwopus-35b-a3b-coder
      - qwen3-coder-reap-25b-a3b-eval
      - agents-a1-eval
      - ministral-3-14b-reasoning-eval
      - ling-mini-2-eval
      - glm-4-6v-flash-eval
      - msp-ops-qwen3-8b
      - devstral-small-2-24b
      - devstral-small-2-24b-spec
      - gemma-4-26b-a4b-it
      - glm-4.7-flash-reap-23b-a3b
      - qwen3-30b-a3b-thinking-eval
      - qwen3-6-27b-thinkingcap
      - qwen3-4b-thinking-eval
      - qwen3-5-4b-eval
      - qwen3-5-4b-ticket-agentic
      - harness-1-q4-k-m
  utility:
    persistent: true
    swap: false
    exclusive: false
    members:
      - qwen3-reranker-4b

hooks:
  on_startup:
    preload:
      - qwen3-reranker-4b
      # 2026-07-04: dropped qwen3-coder-30b-a3b-q4 from startup preload. It's
      # a "chat" group member (swap:true, exclusive:true) that already loads
      # on-demand when actually requested - force-preloading a 30B model on
      # EVERY reload/restart made it fight the reranker (and whatever chat
      # model a reload happens to interrupt) for the same two GPUs' VRAM at
      # the worst possible moment. Traced today's repeated Vulkan OOM errors
      # on reload to this, and it escalated once to a full systemd
      # oom-kill of the whole llama-swap service (host RAM, 27.5G peak,
      # 14.9G swap peak) during a config reload. Removing it here doesn't
      # stop it being used - opencode still loads it fine on first request.
