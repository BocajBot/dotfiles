  # VRAM IS THE FRAGILE PART AND THE STANDALONE NUMBER UNDERSTATES IT: a direct
  # run read 23264 MiB (95%), the same entry through llama-swap reads 23731 MiB
  # (96.6%) - ~829 MiB free. Trust the production number. It survives only
  # because the `chat` group is exclusive; nothing else may share the card with
  # this entry. If anything becomes co-resident, or KV/batch grows, or a load
  # fails: DROP ctx TO 32768. Re-measure, do not assume.
  # 64K IS MEASURED AT DEPTH, not inferred from a load that reserved it - a
  # 58689-token prompt through llama-swap returned HTTP 200 with the needle
  # recalled and the kernel log clean. This box has hung a compute ring on a
  # near-limit prefill before, so that distinction matters.
  # Think-seam checked at n-max 3 and clean. Residual nondeterminism is mild
  # (1 flip in 6 code reps); greedy evals still prefer an undrafted entry.
  # SAMPLING CARD-CONFORMANT 2026-08-25 (Qwen/Qwen3.6-27B): thinking-mode text
