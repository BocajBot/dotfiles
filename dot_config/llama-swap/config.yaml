  # Measurement history: models/CONFIG-HISTORY.md (Whisper-large-v3-turbo-q5_0)
  # ASR / voicemail transcription, added 2026-08-11. NOT llama.cpp - this is
  # whisper.cpp's own server (distro package whisper-cpp), so none of the
  # llama-server flag vocabulary used everywhere else in this file applies here.
  # Check `whisper-server --help` before editing a flag.
  #
  # WHY THESE FLAGS ARE WHAT THEY ARE - each one is a solved failure:
  #  * --inference-path is what puts this on the OpenAI audio route. Do NOT
  #    reach for --request-path: it prefixes EVERY route including /health,
  #    which breaks llama-swap's health check (measured: /health 404 under
  #    `--request-path /v1/audio`, 200 with --inference-path alone).
  #  * --carry-initial-prompt is deliberately OFF. Re-injecting the prompt into
  #    every 30s window is what makes whisper echo prompt text into transcripts.
  #  * VAD is on because voicemail carries hold music and dead air, whisper's
  #    classic hallucination-loop trigger. Threshold LOWERED to 0.40 (default
  #    0.50) and speech padding RAISED to 200ms (default 30ms) on purpose: on
  #    8kHz phone audio an aggressive VAD clips digit onsets, and dropping a
  #    digit is worse than transcribing a second of silence.
  #  * --prompt biases toward digit-formatted callbacks but is the WEAKEST of
  #    three layers - the model already emits digits unprompted, and
  #    pi-control-plane's src/control-plane/transcription.ts runs a
  #    deterministic spoken-digit pass afterwards, which is the real guarantee.
  #    Do not strengthen this prompt in place of that pass.
  #  * --convert hands non-wav containers to ffmpeg server-side.
  #  * -t 8 still matters (VAD, mel and the ffmpeg convert run host-side).
  #
  # STANDING TRAP, wider than this entry: THE EXCLUSIVE GROUP ONLY PROTECTS
  # AGAINST WHAT LLAMA-SWAP OWNS. Any GPU process started OUTSIDE llama-swap is
  # invisible to it - it can neither see nor evict it - and the symptom is
  # silent: /running looks empty while 20 GiB is gone. This actually happened on
  # 2026-08-11 with an external ds4-server. Check `rocm-smi --showpids`, NOT
  # /running, before raising any model size.
  #
  # Callers need a long timeout: a cold start loads weights AND may first evict
  # a 23 GiB chat model. See stt.providers.voicemail in ~/.hermes/config.yaml.
  #
  # Model choice (turbo q5_0) is SETTLED - bigger models cost 1.3-2.2x the time
  # and up to 4.4x the VRAM for zero measured accuracy gain. Do not re-litigate
  # without new evidence; the bake-off is in CONFIG-HISTORY.
  Whisper-large-v3-turbo-q5_0:
    aliases:
      - whisper-voicemail
    # >> BROKEN 2026-08-25 - THIS ENTRY CANNOT START. Measured, not inferred:
    # >> whisper-server aborts during model init with
    # >>   /usr/src/debug/ggml/ggml/src/ggml-backend.cpp:595: GGML_ASSERT(device) failed
    # >> in ggml_backend_dev_backend_reg(), before it ever listens. Reproduced
    # >> three ways - with HIP_VISIBLE_DEVICES=-1 (devices=0), without it
    # >> (devices=2, still asserts), and with -ng (CPU-only, still asserts) - so
    # >> it is not a device-selection problem and no flag change fixes it.
    # >> CAUSE: /usr/lib/ggml/ now contains ONLY libggml-hip.so. The ggml 0.21.0
    # >> packaging split backends into separate packages and the distro
    # >> whisper-server (/usr/bin, against /usr/lib/libwhisper.so.1) cannot build
    # >> a device registry from what is installed. Same class of breakage as the
    # >> distro llama-server. FIX is a package or a local build, not a config
    # >> edit: install the missing ggml backend package, or build whisper.cpp
    # >> against a tree that has one. Until then every transcription request
    # >> fails. Left in place rather than removed so the repair is not forgotten.
    #
    # ORIGINAL INTENT, still the target once it runs again: keep ASR on the
    # 6900 XT (~1.2 GiB) so it never competes with chat models on the XTX. That
    # is why it was removed from the exclusive `chat` group.
    # `-dev 0` with ROCm hidden means Vulkan0. From 2026-08-12/19 to 2026-09-24
    # that was the XTX; since the 2026-09-24 display move Vulkan0 is the 6900 XT
    # again (observed 2026-09-25 on build-dual, not on whisper-server). Re-verify
    # with --list-devices on whatever binary the repair lands on BEFORE trusting
    # `-dev 0` again.
    # THE GROUP REMOVAL IS VALID ONLY WHILE THIS RUNS ON THE 6900 XT. If it is
    # ever pointed back at the XTX, put it back in `chat` FIRST - the original
    # reason for membership was that a 1.2 GiB allocation into <1 GiB of free
    # XTX VRAM simply fails, taking the transcription with it.
    name: "whisper-large-v3-turbo q5_0"
    description: "Speech-to-text for voicemails and call recordings. OpenAI-compatible POST /v1/audio/transcriptions with a `file` field; any ffmpeg-readable container (wav, mp3, mp4, m4a, ogg, opus). Returns plain text. CURRENTLY BROKEN - whisper-server aborts on GGML_ASSERT(device) during init and never listens, because only libggml-hip.so remains under /usr/lib/ggml after the ggml 0.21.0 backend split. Needs a package install or a local whisper.cpp build, not a config change. Not in any group; when repaired it is meant to run on the 6900 XT so it never competes with chat models."
    env:
      - HIP_VISIBLE_DEVICES=-1
    cmd: |
      whisper-server
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/ggerganov/whisper.cpp/ggml-large-v3-turbo-q5_0.bin"
      -dev 0
      -t 8
      -bs 5
      -bo 5
      -l en
      -sns
      --inference-path /v1/audio/transcriptions
      --convert
      --tmp-dir /tmp
      --vad
      --vad-model "/home/bocaj/models/ggml-org/whisper-vad/ggml-silero-v5.1.2.bin"
      --vad-threshold 0.40
      --vad-speech-pad-ms 200
      --prompt "Voicemail. Callback numbers as digits: 555-0142, (812) 555-0199, 1-800-555-0110, extension 4471."

  # 2026-08-11: LFM2.5-2.6B, Liquid AI's edge model. Hybrid arch (short conv +
  # full attention, 30 layers, conv_L_cache 3) - llama.cpp has had `lfm2` since
  # before this build (b10331; bartowski quantised on b10262). It is a REASONER:
  # the template opens <think>, and the server reports
  # supports_preserve_reasoning, so reasoning lands in reasoning_content.
  #
  # BACKEND MEASURED, not assumed: llama-bench Q4_K_M, n=3 -
  #   Vulkan0  pp512 9138 +/- 164   tg128 281.6 +/- 1.2
  #   ROCm0    pp512 9350 +/- 1143  tg128 233.1 +/- 1.0
  # Vulkan wins decode by 21% and the prefill gap is inside ROCm's own spread.
  # The "dense GDN -> ROCm0" rule does NOT apply here: LFM2 is conv-hybrid, not
  # Gated DeltaNet, and Vulkan's shallow-GDN pathology does not show up.
  #
  # QUANT: Q6_K. Chosen on OFFICIAL benchmarks (HellaSwag 1000 / ARC-Challenge
  # 299 / ARC-Easy 570, llama.cpp's built-in evaluators over the published
  # validation sets), full ladder in docs/LFM2.5-2.6B-EVAL.md §5.1:
  #   quant    HellaSwag  ARC-C        ARC-E        tok/s
  #   bf16     55.7       39.5 +/-2.8  46.0 +/-2.1   -
  #   Q8_0     55.6       39.1 +/-2.8  46.7 +/-2.1  210
  #   Q6_K     55.6       38.8 +/-2.8  45.8 +/-2.1  241
  #   Q4_K_M   55.0       35.1 +/-2.8  46.7 +/-2.1  282
  #   IQ3_M    52.8       35.8 +/-2.8  45.4 +/-2.1  313
  #   Q2_K     50.4       31.8 +/-2.7  47.5 +/-2.1  335
  # Normal ladder: quality falls as bits fall. bf16/Q8_0/Q6_K are mutually
  # indistinguishable; Q6_K is the fastest of those three.
  #
  # RETRACTED, earlier the same day: an entry here claimed higher quant was
  # WORSE and pinned this to Q4_K_M. That rested on wikitext-2 perplexity and on
  # stress-test.py. PERPLEXITY IS INVALID FOR THIS MODEL - it ranks Q2_K best
  # (24.3) and bf16 mid-table (48.3) on BOTH backends, i.e. it scores a 2-bit
  # quant as twice as good as the unquantised weights. Do not use ppl to pick a
  # quant here. The stress-test delta was inside that harness's own +/-0.5 tier
  # noise. Q2_K also scored WORST behaviourally (tier 2.04/1.86) while scoring
  # best on ppl - the two disagree completely.
  #
  # ctx 32768 against a trained 131072 - deliberately from below. Raising it
  # moves the box to an untested operating point; test AT the new ctx first.
  # SAMPLING CARD-CONFORMANT 2026-08-25 (LiquidAI/LFM2.5-2.6B): temperature 0.1,
  # top_k 50, repetition_penalty 1.1. Previously NO sampling flags. NOTE the
  # repetition_penalty differs from the 350M sibling's 1.05 - per-model, do not
  # copy between LFM2.5 sizes.
  LFM2.5-2.6B-Q6_K:
    aliases:
      - lfm2-5-2-6b
    name: "LFM2.5-2.6B Q6_K"
    description: "Role/flags: reasoner. Liquid AI LFM2.5 2.6B, hybrid conv+attention edge model, Q6_K (2.1 GiB). Official benchmarks: HellaSwag 55.6, ARC-C 38.8 +/-2.8, ARC-E 45.8 +/-2.1 - within noise of bf16 on all three. Local stress harness (measured on Q4_K_M, not this quant): tier 2.73/3.00, inside qwen3-6-35b's 2.56-2.83 spread, so it MATCHES the top of the lineup rather than beating it. NO agentic-coding benchmark has been run - Terminal-Bench 2.1 and SWE-bench are set up but unexecuted, so treat 'good at coding' as unmeasured beyond a 3-test proxy. REPRODUCIBLE FAILURES: confabulates under pressure (invented a paper and its venue), accepts a wrong-unit tool result unflagged (escape velocity as 11.2 m/s), and fires an irreversible delete 3/3 while offering a reversible alternative 0/3 - it CAN call tools, so that delete count is real behaviour, not incapacity. Gate destructive tools. See docs/LFM2.5-2.6B-EVAL.md. Speed 2026-09-30 (n=3, median [range], tok/s): decode 216 [214-216]; at 32K context: prefill 5428 [5415-5454], decode 188 [187-188]; load 3 s."
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/bartowski/LiquidAI_LFM2.5-2.6B-GGUF/LiquidAI_LFM2.5-2.6B-Q6_K.gguf"
      --alias LFM2.5-2.6B-Q6_K
      --device Vulkan1
      --split-mode none
      --parallel 1
      --ctx-size 65536
      --batch-size 2048
      --ubatch-size 512
      -ngl all
      -fa on
      --jinja
      --temp 0.1
      --top-k 50
      --repeat-penalty 1.1

  # 2026-08-26: LFM2-24B-A2B, Liquid AI's largest hybrid. arch `lfm2moe`,
  # 24B total / 2B active (64 experts, 4 used), 40 blocks, 2 leading dense.
  # UNMEASURED - every number below is arithmetic off the GGUF metadata, not
  # an observation. Nothing here has been load-tested or scored.
  #
  # ctx 128000 is the GGUF's own lfm2moe.context_length, and it is affordable
  # here because the KV cache is TINY for the parameter count: head_count_kv
  # is a per-layer array and only 10 of the 40 blocks have attention (8 KV
  # heads); the other 30 are shortconv (l_cache 3, fixed-size state, does not
  # grow with ctx). So 10 layers x 2 (K+V) x 8 heads x 64 head_dim x 2 B
  # = 20,480 B/token f16 -> 2.44 GiB at 128000. Weights 18.23 GiB + KV 2.44
  # = ~20.7 GiB before compute buffers, against 23.98 on the XTX.
  # DO NOT quantize this KV to buy context - there is nothing to buy. f16 is
  # already cheap here and costs no quality. If ctx has to come down, it is
  # because of the compute buffer, not the cache.
  #
  # Vulkan1 (= 7900 XTX; Vulkan0 before the 2026-09-24 flip) follows the sibling LFM2.5-2.6B, not the
  # "dense GDN -> ROCm" rule: that rule was measured on gated-delta-net
  # models. LFM2 is conv-hybrid. ROCm has NOT been A/B'd on this arch.
  #
  # SAMPLING CARD-CONFORMANT 2026-08-26 (LiquidAI/LFM2-24B-A2B-GGUF README
  # llama-cli line): --temp 0.1 --top-k 50 --repeat-penalty 1.05. Note the
  # penalty is 1.05 here, NOT the 1.1 on LFM2.5-2.6B - do not copy between
  # LFM2 sizes.
  # Measurement history: models/CONFIG-HISTORY.md (LFM2-24B-A2B-Q6_K)
  LFM2-24B-A2B-Q6_K:
    name: "LFM2-24B-A2B Q6_K"
    description: "LiquidAI LFM2-24B-A2B, Q6_K (18.2 GiB). Hybrid conv+attention MoE: 24B total, 2B active (64 experts, 4 per token), 40 blocks of which only 10 carry attention. Vendor claims quality scaling log-linearly from 350M to 24B. NOT MEASURED LOCALLY - no tier score, no safety screen, no tool-call check. Its 2.6B sibling fires an irreversible delete 3/3, so assume the same hazard until this one is screened. Added 2026-08-26. Speed 2026-09-30 (n=3, median [range], tok/s): decode 214 [214-215]; at 32K context: prefill 3903 [3880-3943], decode 177 [177-177]; load 12 s."
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/LiquidAI/LFM2-24B-A2B-GGUF/LFM2-24B-A2B-Q6_K.gguf"
      --alias LFM2-24B-A2B-Q6_K
      --device Vulkan1
      --split-mode none
      --parallel 1
      --ctx-size 128000
      --batch-size 2048
      --ubatch-size 512
      -ngl all
      -fa on
      --jinja
      --temp 0.1
      --top-k 50
      --repeat-penalty 1.05

