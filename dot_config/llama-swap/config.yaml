      -mmdev ROCm0
      --load-mode none
      --n-cpu-moe 0
      --split-mode layer
      --parallel 1
      --ctx-size 65536
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 1024
      --ubatch-size 256
      -ngl all
      -fa on
