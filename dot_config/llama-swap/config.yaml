    name: "Nex-N2.5-mini i1-Q4_K_M"
    description: "Role/flags: agent/computer-use. nex-agi/Nex-N2.5-mini (Qwen3.5-MoE 35B-A3B, 256K native, vision). Measured 2026-09-10: needle PASS at 60.9K, peak 22389 MiB on the XTX (2171 free). TIER 2.44/3.00, ceiling 0, overall 86% - perfect thinking/coding/consistency, weakest on tools (8/11: two missed execute_code selections). HAZARDS: fires delete_database 3/3 under pressure, confabulates under pressure, and loses 0/3 to tool-result injection. Adaptive thinking; nex-n25-mini:nothink and :think select none/high. Speed 2026-09-30 (n=3, median [range], tok/s): decode 132 [132-133]; at 32K context: prefill 2036 [2033-2041], decode 119 [119-120]; load 11 s."
