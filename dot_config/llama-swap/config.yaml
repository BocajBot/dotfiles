# llama-swap config (~/.config/llama-swap/config.yaml)
#
# LIVE FILE: llama-swap runs with -watch-config and reloads on every save, and a
# reload UNLOADS whatever model is resident. Edit a copy, validate it with
#   ~/.local/bin/llama-swap -validate -config <copy>
# then mv it into place (one atomic write, one reload). Backups sit beside this
# file as config.yaml.bak-<date>-pre-<tag>.
#
# NAMES AND DESCRIPTIONS (rule set 2026-10-01): `name` holds ONLY the model's official name and its
# quantization (e.g. "Qwen3.6-35B-A3B UD-Q4_K_M"); a short tag is allowed only to tell apart locally
# made variants of the same weights (REAP prune, expert subset, local requant). Roles, tier scores, hazard
# flags, speeds, ctx and placement belong in `description`, never in `name`. Pi and other clients show
# `name`, so keep it clean. Speeds in descriptions come from ~/llama-swap-work/speed-2026-09-30/speed.py
# (n=3, raw /completion, cold prompt); re-measure and replace the speed sentence when an entry changes.
# CONTEXT FLOOR (2026-10-01): every chat entry gets --ctx-size >= 65536 unless a tested exception is
# documented in its block (Instella: native 32768, YaRN breaks it).
#
# HARDWARE: two AMD cards, no NVIDIA / no CUDA. The two backends enumerate them
# in OPPOSITE order - --device numbers are enumeration-order and move whenever a
# GPU or driver changes. `--list-devices` on the SAME binary an entry uses is
# the only authority; re-verify before changing any --device line.
# OBSERVED 2026-09-25 (--list-devices, build-dual): Vulkan order FLIPPED vs the
# 2026-09-03 mapping - Vulkan0 is now the 6900 XT (likely since the display
# moved to it on 09-24). All `--device`/`--spec-draft-device Vulkan0` lines
# were re-pointed to Vulkan1 (the XTX) on 2026-09-25. Vulkan index numbers in
# measurement comments dated BEFORE 2026-09-24 use the old numbering
# (Vulkan0 = XTX); read them as "the XTX", not as current indices.
#   RX 7900 XTX 24 GB (gfx1100, PCI 0b:00.0) = ROCm1 = Vulkan1   workhorse
#   RX 6900 XT  16 GB (gfx1030, PCI 06:00.0) = ROCm0 = Vulkan0   drives the
#     display since 2026-09-24, so it keeps >=1.5 GiB compositor headroom; the
#     XTX may be filled to the edge.
# Mixed gfx1100+gfx1030 HIP tensor-splits are a hazard; dual-card splits that
# are not explicitly measured stay Vulkan-only.
#
# BINARY: ONE llama-server for every llama.cpp entry - the `unified` branch of
# ~/Downloads/llama.cpp-unified (upstream master + local Vulkan/MTP patches +
# Instella-MoE + llama-forge glm5next/qwen4exp/streamed-weights + spark2_5 PR
# 27868; DFlash2 is upstream #27816), built with HIP AND Vulkan in one binary
# (build-pq2-dual), exposed as ${llama_server}. Exceptions are named in their
# entries (Ternary-Bonsai runs the PrismML fork; Qwen-Image is sd-server;
# Whisper is whisper-server). On a multi-backend binary a dflash/dspark DRAFT
# must be pinned with --spec-draft-device to the base's device or it aborts at
# load with
#   pre-allocated tensor (output.weight) in a buffer (Vulkan0) that cannot run the operation (NONE)
#
# COMMENT POLICY: a comment left in this file is a live constraint or gotcha -
# if it says not to change something, that is the whole warning. Measurement
# history, rejected alternatives and changelogs live in
# models/CONFIG-HISTORY.md (one section per entry); entries removed from this
# file are logged in models/REMOVED-MODELS.md. The 2026-08-06 single-card audit
# is docs/CONFIG-AUDIT-20260806.md. The pre-2026-08-23 launch guard is gone; a
# failed GPU allocation now just fails the load.
macros:
  # 2026-10-02: back to the single unified tree. Branch `unified` = 1d7942fc7 + Q4_1 RDNA3 kernel commits
  # b14005495..932ac4e3a (verified, ~/q41opt-work/RESULTS.md) + DFlash image-gap fix 0bf44a67b (formerly an
  # uncommitted patch in the llama.cpp-unified-dftfix checkout, now retired). Kernels ISA-identical to the build
  # measured in ~/q41opt-work/prode2e-nt (+5% decode, -5..6% verify step vs build-dftfix).
  # Revert = backups/config.yaml.2026-10-02-pre-unified-q41
  llama_server: /home/bocaj/Downloads/llama.cpp-unified/build-pq2-dual/bin/llama-server

healthCheckTimeout: 900
logLevel: info
logToStdout: both
globalTTL: 900

