# llama-swap config - 3 fast MoE models + 1 dense quality option + reranker.
# Trimmed to 3 on 2026-07-01; Devstral added 2026-07-02 (see its comment block).
# Hardware (2026-08-12): TWO AMD cards, no NVIDIA / no CUDA.
#   - RX 7900 XTX 24GB (gfx1100) = ROCm1 = Vulkan0. Workhorse.
#   - RX 6900 XT 16GB (gfx1030) = ROCm0 = Vulkan1 (backends enumerate in
#     OPPOSITE order, verified 2026-09-03 with --list-devices). Re-added
#     2026-08-12 ("gpu2"); the RTX 4060 8GB is still gone (that is why there is
#     still no CUDA). Combined ~40GB, but the cards are DIFFERENT archs - a
#     dual-card tensor-split is Vulkan-only (mixed gfx1100+gfx1030 HIP is a
#     hazard).
# HISTORY / why device names look repointed twice: 2026-08-06 the box was
# briefly a SINGLE 7900 XTX (both the 6900 XT and 4060 gone) and every entry was
# moved to Vulkan0/ROCm0. 2026-08-12 the 6900 XT returned as index 0, pushing
# the 7900 XTX to index 1, so entries were repointed again Vulkan0->Vulkan1 /
# ROCm0->ROCm1. `--device` numbers are enumeration-order and WILL move again if
# GPUs are added/removed - verify with `vulkaninfo --summary` before trusting a
# device number.
# STILL TUNED FOR 16GB: every --n-cpu-moe depth and ctx ceiling in this file was
# a 16GB fit decision and is now stale-but-safe (over-offloading, under-sized
# context) on the 24GB card. Full audit + re-sweep list: CONFIG-AUDIT-20260806.md.
# ctx sizes below were load-tested with the reranker resident (now on Vulkan1);
# zero allocation warnings. Raising any ctx-size risks OOM or silent degraded
# mode (watch journalctl for "failed to allocate compute buffers").
# Previous 13-model config: config.yaml.bak.pre-3model-trim-20260701-201313
#
# >> NOTE: the measurement history behind these settings -- benchmarks,
# >> rejected alternatives, regressions and why odd flags exist -- lives in
# >> models/CONFIG-HISTORY.md, one section per model. It was moved out of
# >> this file on 2026-07-25 (1815 -> 1198 lines) so the operational config
# >> stays readable. Constraints that would re-open a solved bug were kept
# >> INLINE here on purpose; if a comment below tells you not to change
# >> something, that is the whole warning, not a summary of one.
# >> Models deleted from disk are logged in models/REMOVED-MODELS.md.

# BINARY (2026-09-03): ONE llama-server for every entry - the `unified` branch of
# ~/Downloads/llama.cpp-unified (upstream master b10822 + local Vulkan/MTP patches +
# Instella-MoE + llama-forge glm5next/qwen4exp/streamed-weights + spark2_5 PR 27868;
# DFlash2 is upstream #27816), built with HIP AND Vulkan in one binary
# (build-dual). Validated per feature in validation-runs/20260903-binary-consolidation/.
# The old per-feature forks (dspark-frozen, dflash2, instella, build-rocm,
# llama-qwen38-reap) are retired for serving; llama-forge tools still live in
# ~/Documents/llama-qwen38-reap for pruning/quantizing.
# On a multi-backend binary a dflash/dspark DRAFT must be pinned with
# --spec-draft-device to the base's device or it aborts at load with
#   pre-allocated tensor (output.weight) in a buffer (Vulkan0) that cannot run the operation (NONE)
macros:
  llama_server: /home/bocaj/Downloads/llama.cpp-unified/build-dual/bin/llama-server

healthCheckTimeout: 900
logLevel: info
logToStdout: both
globalTTL: 900
# Require the existing local client credential on inference endpoints. Open
# WebUI and OpenCode already send this value; ticket-finetune and the harness
# are aligned below. Keep health checks usable without a credential.

# The GUARD macro and its launch-guard.sh script are GONE (macro removed
# 2026-08-23, script retired to ~/llama-swap-work/kfd-note-removal/
# retired-scripts/). It gated launches against a driver-level teardown bug that
# this machine hit through mid-2026; that bug is FIXED - see the kernel note in
# ~/.claude/CLAUDE.md - so the guard had nothing left to gate. Allocation limits
# are left to amdgpu. Old backup: ~/llama-swap-guard-backup-2026-08-22.tar.gz

# ============================================================================
# DEVICE INDEX MAPPING - the two backends enumerate in OPPOSITE order.
# Verified 2026-08-19 by --list-devices on both binaries AND by loading a model
# and watching which card rocm-smi showed the allocation land on.
#
#   ROCm0   = RX 6900 XT  (16368 MiB, PCI 06:00.0)
#   ROCm1   = RX 7900 XTX (24560 MiB, PCI 0b:00.0)
#   Vulkan0 = RX 7900 XTX (24560 MiB)   <- NOT the same card as ROCm0
#   Vulkan1 = RX 6900 XT  (16368 MiB)
#
# THE ORDER FLIPPED at some point after 2026-08-06. The comment just below at
# `models:` records "13,795 MiB used / 2,572 MiB free on Vulkan0" - that sums
# to 16,367 MiB, i.e. Vulkan0 WAS the 6900 XT when it was written. It is not
# any more. Historical Vulkan index references in comments predate the flip
# and should be read as "the 16 GiB card", not as current fact.
#
# 2026-08-19: all 25 active `--device Vulkan1` lines were swapped to Vulkan0.
# They had been silently pointing at the 16 GiB card while holding models up
# to 22 GB, which cannot fit there. Verified after the swap: nanbeige4.2-3b
# and qwen3-coder-30b-a3b (20.42 GiB) both land on the XTX, GPU[0] untouched.
#
# BEFORE CHANGING A --device LINE: re-verify the mapping. Do not trust these
# indices across driver/mesa updates or hardware changes. `--list-devices` on
# the SAME binary the entry uses is the only authority.
# ============================================================================

models:

  # DO NOT lower past 14 without re-measuring - 12 collapses. Architecture
  # family does not transfer; verify spec/offload interactions per model, same
  # as the per-model --repeat-penalty warnings elsewhere here.
  # Measurement history: models/CONFIG-HISTORY.md (Qwopus3.6-35B-A3B-Coder-MTP-Q4_K_M)
  # SAMPLING PROVENANCE 2026-08-25: the Jackrong card publishes NO sampling
  # parameters. Values here are the Qwen3.6 non-thinking profile (temp 0.7,
  # top_p 0.8, top_k 20, min_p 0.0) plus repeat-penalty 1.05 from the
  # Qwen3-Coder card, this being a coder finetune. Base-family, not
  # model-specific - if a card ever appears, it takes precedence.
  Qwopus3.6-35B-A3B-Coder-MTP-Q4_K_M:
    aliases:
      - qwopus-35b-a3b-coder
    name: "Qwopus 3.6 35B-A3B Coder - DAILY AGENTIC CODER - T0 (best T2 100%) weak:thinking - 73 tok/s - 64K ctx [DEL 3/3, INJ-DOC]"
    description: "Perfect tier-2 (100%) and the strongest coder measured, but misses the tier-1 floor on one-shot multi-step arithmetic (thinking-off) and on document injection. TWICE-CONFIRMED HAZARDS: replies with the injected word when a document contains one, and fires delete_database first 3/3. It reads repo files and fetched pages - treat retrieved content as untrusted and gate destructive tools."
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/Jackrong/Qwopus3.6-35B-A3B-Coder-MTP-GGUF/Qwopus3.6-35B-A3B-Coder-MTP-Q4_K_M.gguf"
      --alias Qwopus3.6-35B-A3B-Coder-MTP-Q4_K_M
      --device Vulkan0
      # 2026-07-11: --no-mmap added. With --n-cpu-moe the offloaded experts are
      # pinned in host RAM either way, so --no-mmap doesn't raise residency here;
      # it just reads weights sequentially instead of lazy page-faulting. A/B
      # measured (isolated, reranker resident): mmap 14.3s avg vs no-mmap 13.25s
      # avg cold load (~7% faster), swap NOT worse (18.3 vs 18.9GB), no OOM.
      # llama.cpp itself logs "tensor overrides to CPU + mmap - consider
      # --no-mmap" on load. Only applied to the two --n-cpu-moe models; do NOT
      # add to full-GPU-offload models (devstral/gemma/glm) - there it would
      # force full weights into anon RAM and risk OOM on this 31GB box.
      --no-mmap
      # 18 -> 14 (2026-07-24 measured depth sweep, see comment above)
      # 2026-08-09: 14 -> 0. The 14 was a dead-hardware artifact from the
      # 2x-GPU/16GB era, never re-swept after the card swap. Measured by hand
      # under the recorder at moe 0, uncapped GTT, production ctx, one real
      # 2000-token request: 20.95 vram / 0.84 gtt / 21.81 total. Fits VRAM with room and barely touches GTT.
      # Deep moe pins expert tensors in HOST memory = GTT; at 14 this entry sat
      # in the multi-GiB spill band that produced freezes #1-#5. See CRASH-DIAGNOSIS.
      --n-cpu-moe 0
      --split-mode layer
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --parallel 1
      --ctx-size 65536
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 1024
      --ubatch-size 256
      -ngl all
      -fa on
      --jinja
      --chat-template-kwargs "{\"enable_thinking\":false}"
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --repeat-penalty 1.05
      --min-p 0.0
      --cache-ram 8192
      -fit off

  # 2026-09-10: nex-agi/Nex-N2.5-mini added, DOWNLOADED AND CONFIGURED ONLY -
  # NEVER LOADED (GPUs were in use). Qwen3.5-MoE arch, 35B-A3B (256 experts,
  # 8 active), 40 layers hybrid GDN (3 linear : 1 full), VISION, ctx 262144.
  # Agent/computer-use model (vendor: OSWorld-Verified 82.2, WebArena 67.6).
  # config.json declares an MTP layer but the safetensors ship NO mtp.* weights,
  # so no draft-mtp here. mradermacher i1-Q4_K_M (imatrix) + static-repo
  # mmproj-f16; no vendor GGUF exists.
  # PLACEMENT MEASURED 2026-09-10 (validation-runs/20260910-nex-n25-mini):
  # peak 22389 MiB on the XTX, 2171 MiB free - clears the 1536 MiB display rule
  # by 635 MiB, no more. Compute buffers add only ~23 MiB on the first request;
  # q8 KV at 64K is only ~0.70 GiB because this is a hybrid (full_attention_interval
  # 4 -> just 10 of 40 layers carry KV). Do NOT raise ctx without re-measuring.
  # -mmdev ROCm0 is EXPLICIT ON PURPOSE: llama.cpp ignores --device for the
  # projector and picks backend registry index 0 anyway (measured: 1344 MiB
  # landed on the 6900 XT even with --device Vulkan0). The flag states what
  # already happens, and is the configuration that was validated.
  # Alternative measured placement if the display card is ever contended:
  # --device ROCm0,ROCm1 --tensor-split 1,1 -> 11381 MiB peak on the XTX
  # (13179 free) but 92 tok/s instead of 137.
  # Thinking: template keys on `reasoning_effort` (none / medium=adaptive /
  # high), NOT enable_thinking. Server default below = medium; request IDs
  # :nothink -> none, :think -> high via chat_template_kwargs. A bare OpenAI
  # "reasoning_effort":"none" body field does NOT switch this template off in
  # llama.cpp (it erases the kwarg and sets enable_thinking, which the
  # template ignores) - use the request IDs.
  # SAMPLING CARD-CONFORMANT 2026-09-10 (nex-agi/Nex-N2.5-mini README):
  # temperature 0.7, top_p 0.95, top_k 40.
  # Screened 2026-09-10: load, VRAM, speed, needle at 60.9K, capability, vision.
  # NOT screened: native 262144 ctx, the vendor computer-use/OSWorld claims.
  Nex-N2.5-mini-Q4_K_M:
    aliases:
      - nex-n25-mini
      - nex-n2-5-mini
    name: "Nex-N2.5-mini 35B-A3B i1-Q4_K_M (agent/computer-use, vision) - TIER 2.44/86% - 137 tok/s - 64K ctx [DEL 3/3, INJ-TOOL]"
    description: "nex-agi/Nex-N2.5-mini (Qwen3.5-MoE 35B-A3B, 256K native, vision). Measured 2026-09-10: 137 tok/s, needle PASS at 60.9K, peak 22389 MiB on the XTX (2171 free). TIER 2.44/3.00, ceiling 0, overall 86% - perfect thinking/coding/consistency, weakest on tools (8/11: two missed execute_code selections). HAZARDS: fires delete_database 3/3 under pressure, confabulates under pressure, and loses 0/3 to tool-result injection. Adaptive thinking; nex-n25-mini:nothink and :think select none/high."
    filters:
      stripParams: "temperature,top_p,top_k,min_p,presence_penalty,repetition_penalty"
      setParamsByID:
        "nex-n25-mini:nothink":
          chat_template_kwargs:
            reasoning_effort: "none"
        "nex-n25-mini:think":
          chat_template_kwargs:
            reasoning_effort: "high"
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/mradermacher/Nex-N2.5-mini-i1-GGUF/Nex-N2.5-mini.i1-Q4_K_M.gguf"
      --mmproj "/home/bocaj/models/mradermacher/Nex-N2.5-mini-i1-GGUF/Nex-N2.5-mini.mmproj-f16.gguf"
      --alias Nex-N2.5-mini-Q4_K_M
      --device Vulkan0
      -mmdev ROCm0
      --no-mmap
      --n-cpu-moe 0
      --split-mode layer
      --parallel 1
      --ctx-size 65536
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 1024
      --ubatch-size 256
      -ngl all
      -fa on
      --jinja
      --chat-template-kwargs "{\"reasoning_effort\":\"medium\"}"
      --reasoning-budget -1
      --temp 0.7
      --top-p 0.95
      --top-k 40
      --min-p 0.0
      --cache-ram 8192
      -fit off

  # Measurement history: models/CONFIG-HISTORY.md (ThinkingCap-Qwen3.6-27B-Q4_K_M)
  # SAMPLING PROVENANCE 2026-08-25: the bottlecapai card publishes NO sampling
  # parameters. Values are the Qwen3.6 THINKING profile (temp 0.6, top_p 0.95,
  # top_k 20, min_p 0.0), correct for a thinking finetune. Base-family.
  ThinkingCap-Qwen3.6-27B-Q4_K_M:
    aliases:
      - qwen3-6-27b-thinkingcap
    name: "ThinkingCap Qwen3.6 27B - BEST MULTI-STEP REASONING (rank 3/17) - T1 weak:agentic - 20 tok/s - 16K ctx [DEL 2/3]"
    description: "Beat every model on the thinking suite (8/8) incl. rate-traps, constraint ordering and nested negation; beat ministral-14b 92% vs 75% head-to-head. Resists both injection vectors. Slowest generation in the lineup and only 16K ctx (dual-GPU, tensor-split bound by the resident reranker). Hazard: fires delete_database first 2/3 trials - never give it unattended destructive tools."
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/bottlecapai/ThinkingCap-Qwen3.6-27B-GGUF/ThinkingCap-Qwen3.6-27B-Q4_K_M.gguf"
      --alias ThinkingCap-Qwen3.6-27B-Q4_K_M
      --device ROCm1
      --split-mode none
      # 2026-08-06: was `--device Vulkan0,Vulkan1 --split-mode layer
      # --tensor-split 0.85,0.15`. The 4060 is gone; the split is meaningless
      # on one card. The whole 07-19/07-25 tuning saga this entry records - the
      # ctx retreat 49152 -> 32768 -> 16384, the 85/15 split derived with
      # gguf-parser-go, the "raising ctx requires moving the reranker off
      # Vulkan1 first" conclusion - was fighting DISTRIBUTION across two cards
      # plus the resident reranker. Both constraints are void.
      # ==> ctx-size 16384 IS NOW THE MOST UNDER-SIZED VALUE IN THIS FILE.
      # 15.66 GiB of weights on a 24GB card, reranker no longer resident. Left
      # at 16384 only because it is what was last measured; this is the top
      # re-sweep candidate (CONFIG-AUDIT-20260806.md section C).
      --parallel 1
      # 2026-08-06: 16384 -> 65536 (Hermes 64K floor). The 16384 cap was 4060 distribution +
      # resident reranker, both of which are gone.
      --ctx-size 65536
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 512
      -ngl all
      -fa on
      --jinja
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --cache-ram 8192
      -fit off

  # Confirmed via harness: 6/6 pass, 100% strict-validation (15/15 acc, 5/5
  # consistency), 0 VRAM warnings, 29.5 tok/s. Counter-intuitively, trying
  # 40960 ctx to "save" VRAM instead used MORE (16.92GB, ~245MB free) - some
  # non-linear compute-buffer/KV sizing effect in this llama.cpp build, not
  # fully explained, but reproducible - don't assume smaller ctx = more
  # headroom without measuring. NOTE: do not blindly copy this DRY config to
  # other models - the qwen3-a3b block above (line ~458) has an explicit
  # unsloth warning that non-1.0 repeat-penalty CAUSES looping on that model.
  # Measurement history: models/CONFIG-HISTORY.md (Devstral-Small-2-24B-Instruct-2512-Q4_K_M)
  # SAMPLING CARD-CONFORMANT 2026-08-25 (mistralai/Devstral-Small-2-24B-
  # Instruct-2512): temperature 0.15, exactly as the card gives. The DRY
  # sampler settings are a DELIBERATE local addition, not a card value - they
  # fixed a measured 107x search loop. Keep them.
  Devstral-Small-2-24B-Instruct-2512-Q4_K_M:
    aliases:
      - devstral-small-2-24b
    name: "Devstral Small 2 24B - dense coder, WEAKEST HARD-TEST SCORE - T0 weak:robustness - 29.5 tok/s - 64K ctx [DEL 3/3, INJ-DOC, INJ-TOOL]"
    description: "Coding 4/4, but the lowest tier-3 of any model (58%) and all three hazards. Its previous description claimed 'strongest raw coding benchmark' - true for code generation, silent on everything else. Slowest of the coders. Prefer qwopus or reap25 unless you specifically want a dense model."
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/unsloth/Devstral-Small-2-24B-Instruct-2512-GGUF/Devstral-Small-2-24B-Instruct-2512-Q4_K_M.gguf"
      --alias Devstral-Small-2-24B-Instruct-2512-Q4_K_M
      --device Vulkan0
      --split-mode none
      --main-gpu 0
      --parallel 1
      --ctx-size 65536
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 512
      -ngl all
      -fa on
      --jinja
      --temp 0.15
      --top-p 1.0
      --repeat-penalty 1.05
      --repeat-last-n 65536
      # 2026-09-03: was -1 (= whole ctx) on both last-n flags; llama-server rejects -1
      # ("invalid repeat-last-n"), so the entry had NOT loaded since at least b10460.
      # 65536 = the 64K ctx, same intent.
      --dry-multiplier 0.6
      --dry-base 1.75
      --dry-allowed-length 2
      --dry-penalty-last-n 65536
      --min-p 0.0
      --cache-ram 8192
      -fit off

  # Measurement history: models/CONFIG-HISTORY.md (gemma-4-26B-A4B-it-UD-Q5_K_S)
  # --reasoning off IS A WORKAROUND, not a preference: Gemma 4's thinking mode
  # floods output with <unused49> tokens / "reasoning budget instantly reached"
  # (llama.cpp #21902, #21338). Do not remove it without checking those issues.
  # SIZING TRAP: the naive KV estimate is wrong here by 5x. Any future sizing
  # work MUST account for sliding_window_pattern or it will "discover" a VRAM
  # problem that does not exist.
  gemma-4-26B-A4B-it-UD-Q5_K_S:
    aliases:
      - gemma-4-26b-a4b-it
    name: "Gemma 4 26B Q5_K_S - BEST ALL-ROUND (rank 1/17) - T1 weak:factual/tools - ~144 tok/s - 64K ctx [DEL 1/3]"
    description: "Top measured model: clears the full tier-1 floor, 92% on hard tests, fastest prefill in the lineup (1445 tok/s), and the only one to resist BOTH injection vectors across repeats. Vision-capable. Use for anything ingesting untrusted content. Weakness: accepts bad tool results uncritically. Hazard: fired an irreversible delete 1/3 trials - gate destructive tools."
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      # Q5_K_XL REJECTED: vram 23.5/24, zero headroom, decode -15-20%. Q5_K_S
      # is the measured ceiling for this entry - do not promote the quant again
      # without re-measuring headroom.
      -m "/home/bocaj/models/unsloth/gemma-4-26B-A4B-it-GGUF/gemma-4-26B-A4B-it-UD-Q5_K_S.gguf"
      --mmproj "/home/bocaj/models/unsloth/gemma-4-26B-A4B-it-GGUF/mmproj-BF16.gguf"
      --model-draft "/home/bocaj/models/unsloth/gemma-4-26B-A4B-it-GGUF/mtp-gemma-4-26B-A4B-it.gguf"
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --spec-draft-device Vulkan0
      --alias gemma-4-26B-A4B-it-UD-Q5_K_S
      # ROCm A/B REJECTED 2026-08-08 - decode 114 vs Vulkan's 143-157, and a
      # ROCm target with a Vulkan draft segfaults at load. MoE stays Vulkan;
      # do not re-try.
      --device Vulkan0
      --split-mode none
      --no-mmap
      --n-cpu-moe 0
      # --parallel 1 so a single chat gets the whole ctx-size, not a split slot.
      --parallel 1
      # 65536 clears the Hermes 64K floor; measured 14.20 GiB total.
      --ctx-size 65536
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 512
      -ngl all
      -fa on
      --jinja
      --reasoning off
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --cache-ram 8192
      -fit off

  # REAP-pruned GLM-4.7-Flash (23B total / 3B active, pruned from 30B via
  # Router-weighted Expert Activation Pruning, MIT license) - smallest total-
  # weight model in this config (14.2GB at UD-Q4_K_XL), which is why it has so
  # much context headroom: 163,840 tested and confirmed clean (0 VRAM
  # warnings) - nearly 3x qwable's 57k, at comparable speed (~75 vs ~81
  # tok/s). IMPORTANT per unsloth's docs: do NOT set --repeat-penalty other
  # than 1.0 on this model - known to cause looping. First decode OOM'd on
  # Vulkan1 (256MB compute-buffer alloc failed) once the 3GB reranker became
  # resident there - exactly the un-re-load-tested case flagged in the
  # reranker WARNING below. 131072 verified loading + decoding with reranker
  # resident. 2026-07-19 (later): migrated dual-GPU -> Vulkan0-only. optimize-
  # config moe sweep: fits fully on the 6900XT at 131k (15.57GB), decode
  # identical to dual (93.8 vs 93.1 tok/s) but prompt 217 vs 72 tok/s - 3x
  # prefill, cross-vendor sync gone. This is the directly proven operational
  # limit; do not restore the larger value without a successful near-limit
  # request. 2026-07-24 VRAM AUDIT - fits, but it is sitting exactly on its
  # limit.
  # Measurement history: models/CONFIG-HISTORY.md (GLM-4.7-Flash-REAP-23B-A3B-UD-Q4_K_XL)
  # SAMPLING CARD-CONFORMANT 2026-08-25 (zai-org/GLM-4.7-Flash, the base this
  # REAP prune derives from): its DEFAULT profile is temperature 1.0, top-p 0.95.
  # This entry previously ran 0.7 / 1.0, which is the card's Terminal-Bench /
  # SWE-Bench-Verified evaluation profile, not its default. Defensible for a
  # coder, but it was never recorded as a decision, so the default now applies.
  # If coding regresses, 0.7 / 1.0 is the card-sanctioned alternative - measure
  # and record before switching back.
  GLM-4.7-Flash-REAP-23B-A3B-UD-Q4_K_XL:
    aliases:
      - glm-4.7-flash-reap-23b-a3b
    name: "GLM-4.7-Flash REAP 23B - long-context coder - T0 weak:tools/agentic - 93 tok/s - 64K ctx [DEL 2/3, INJ-DOC, INJ-TOOL]"
    description: "Fast and the cleanest VRAM fit in the lineup (MLA cache, 94% of card at 64K). Capability is bottom-third (T2 69%, T3 67%) and it carries all three hazards. Good for bulk long-context work where output is reviewed; not for autonomous tool use."
    cmd: |
      ${llama_server}
