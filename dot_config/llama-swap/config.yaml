  # (auto-fitter aborts rather than run when 99 layers look tight).
  # 2026-08-06: was `--device Vulkan0,Vulkan1 --tensor-split 16,6`, standalone
  # (in NO group) because it claimed both cards and conflicted with the resident
  # reranker on Vulkan1. All three of those premises are gone: it now fits
