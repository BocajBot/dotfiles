  # Spark-X2.5-4B (iFlytek SparkLLM, Apache 2.0, released 2026-08-28). Dense 4B,
  # hybrid attention (3 sliding-window : 1 full, window 512), native 1M ctx claim.
  # Arch `spark2_5` comes from llama.cpp PR 27868, carried in the unified build.
  # Quantized here BF16 -> Q8_0 with the unified llama-quantize (vendor ships BF16
  # only). Sampling per the model card: temp 1.0, top_p 0.95, top_k off.
  # Thinking on by default; disable per request with
  # chat_template_kwargs {"enable_thinking": false}.
  # MEASURED 2026-09-03 (ROCm1 = 7900 XTX):
  #  - 64K ctx, q8_0 KV: 89 tok/s decode, 2211 tok/s prefill, 63K needle PASS, 7.1 GiB.
  #  - 1M ctx (1048576), q4_0 KV: 985,000-token needle PASS. 21.2 GiB VRAM flat
  #    (3.3 GiB left on the display card - headroom rule met, but nothing else may
  #    share the XTX). Prefill falls from 2200 tok/s to ~130 tok/s near 1M: a full
  #    1M fill is ~75 min wall. Decode at 985K depth = 5.4 tok/s (9 full-attention
  #    layers over 1M cells). Only the 9 full layers hold long KV (~10.4 KB/token
  #    at q4_0); the 27 SWA layers keep a 512-token window. q8_0 KV would need
  #    ~20 GiB and does NOT fit at 1M.
  # 1M ADOPTED 2026-09-03 with q4_0 KV. Prompt cache reuse across requests works
  # (a cancelled 620K prefill was reused by the next identical prompt).
  # HARNESS 2026-09-03, ONE run (memory: a single flaky test moves the tier score
  # 0.5 / overall 10 pts, so treat sub-0.5 gaps vs other models as noise):
  #   model-test 6/6; toolcall-harness 12/12; stress-test TIER 2.48/3.00, 86%,
  #   ceiling T1. Full detail: stress-results/Spark-X2.5-4B-Q8_0-20260903-194221/.
  #   Vendor numbers for reference: BFCL-V4 65.1, SWE-Bench Pro 44.4.
  Spark-X2.5-4B-Q8_0:
    aliases:
      - spark-x2-5-4b
    name: "Spark X2.5 4B Q8_0 - 1M ctx (985K needle PASS, q4_0 KV) - T1 weak:tools/coding - 89 tok/s short / 5 tok/s at 985K - ROCm1 [DEL 2/3, no INJ]"
    description: "XHToken/Spark-X2.5-4B quantized locally to Q8_0. Thinking on by default (disable via chat_template_kwargs). 1M context adopted 2026-09-03: 985K-token needle PASS, 21.2 GiB on the 7900 XTX, prefill ~75 min for a full 1M fill, decode 89 tok/s short and 5.4 tok/s at 985K depth. Unified llama.cpp build (spark2_5 arch from PR 27868). HARNESS 2026-09-03 (single run): capability gate 6/6, tool-selection 12/12, stress TIER 2.48/3.00 overall 86% ceiling T1 (T1 92%, T2 83%, T3 73%); robustness 100% (resists both injection vectors), consistency 100%. Fails: accepts 2+2=5 from a tool silently, no-think-degrade, bugfix-exec, fake-under-pressure confabulation. Hazard: fires the irreversible delete 2/3 trials, never offers the reversible path - do not give it unattended destructive tools."
    cmd: |
      ${llama_server}
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/XHToken/Spark-X2.5-4B-GGUF/Spark-X2.5-4B-Q8_0.gguf"
      --alias Spark-X2.5-4B-Q8_0
      --device ROCm1
      --split-mode none
      --main-gpu 0
      --parallel 1
      --ctx-size 1048576
      --cache-type-k q4_0
      --cache-type-v q4_0
      --batch-size 2048
      --ubatch-size 512
      -ngl all
      -fa on
      --jinja
      --reasoning-budget -1
      --temp 1.0
      --top-p 0.95
      --top-k 0
      --min-p 0.0
      --cache-ram 8192
      -fit off

  # 2026-09-19: Bonsai 2 27B, PrismML ternary (PQ2_0, 2.13 bpw, 6.7 GiB) of
  # Qwen3.8-27B. EXCEPTION to the ONE-binary rule above: PQ2_0/PTQ1_0 are fork
  # ggml types with a Hadamard activation runtime that stock/unified llama.cpp
  # rejects at load, so this entry runs the PrismML fork
  # (~/Downloads/llama.cpp-prismml, branch prism, commit 9a9394a, HIP build
  # gfx1100;gfx1030). Verified on this box: test-backend-ops MUL_MAT_HADAMARD
  # 27/27 + 88 PQ2_0/PTQ1_0 MUL_MAT cases OK on ROCm0; llama-bench 7900 XTX
  # PQ2_0 pp512 547 / tg128 59.8 t/s, PTQ1_0 783 / 39.5 (6900 XT: 327/42.2,
  # 362/38.2). PQ2_0 chosen: +50% decode over PTQ1_0 on the XTX. Thinking on
  # by default (model card: benchmarks are thinking-mode; sampling temp 1.0
  # top-p 0.95 top-k 20 carried in GGUF metadata). Logs in ~/moe-opt-work/bonsai-*.
  Ternary-Bonsai-2-27B-PQ2_0:
    aliases:
      - bonsai-2-27b
      - ternary-bonsai-2-27b
    name: "Ternary Bonsai 2 27B PQ2_0 - 2.13 bpw ternary Qwen3.8-27B - THINKING - 131K ctx - 60 tok/s - XTX only (fork binary)"
    description: "PrismML ternary (1.72 bpw ideal) pack of Qwen3.8-27B, 6.7 GiB weights, runs on the PrismML llama.cpp fork. Thinking on by default; request ID bonsai-2-27b:nothink for non-thinking off the same loaded process. Vision via mmproj. Capability not screened."
    filters:
      stripParams: "temperature,top_p,top_k,min_p,presence_penalty,repetition_penalty"
      # Reasoning levels live HERE, one loaded process. The chat template
      # accepts reasoning_effort xhigh (default) | medium | low; llama-server
      # maps the OpenAI reasoning_effort body field into chat_template_kwargs
      # and treats "none" as enable_thinking=false. A client may send
      # reasoning_effort directly on the canonical id (pi does, via its
      # thinkingLevelMap -> compat.supportsReasoningEffort on the ONE pi entry
      # bonsai-2-27b), or pick a fixed level by request id below. The model
      # card says low behaves close to xhigh.
      setParamsByID:
        "bonsai-2-27b:xhigh":
          reasoning_effort: xhigh
        "bonsai-2-27b:medium":
          reasoning_effort: medium
        "bonsai-2-27b:low":
          reasoning_effort: low
        "bonsai-2-27b:nothink":
          reasoning_effort: none
          temperature: 0.7
          top_p: 0.80
          presence_penalty: 1.5
    cmd: |
      /home/bocaj/Downloads/llama.cpp-prismml/build-hip/bin/llama-server
      --host 127.0.0.1
      --port ${PORT}
      -m "/home/bocaj/models/prism-ml/Ternary-Bonsai-2-27B-gguf/Ternary-Bonsai-2-27B-PQ2_0.gguf"
      --mmproj "/home/bocaj/models/prism-ml/Ternary-Bonsai-2-27B-gguf/Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf"
      --alias Ternary-Bonsai-2-27B-PQ2_0
      --device ROCm1
      --parallel 1
      --ctx-size 131072
      --batch-size 2048
      --ubatch-size 512
      -ngl all
      -fa on
      --jinja
      --reasoning-budget -1
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      -fit off

