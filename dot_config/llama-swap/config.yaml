  # Qwen3.8-27B (hybrid GDN, VISION + hybrid thinking). Added 2026-08-14 from
  # https://unsloth.ai/docs/models/qwen3.8 . Backup: config.yaml.bak-2026-08-14-pre-qwen38
  # GTT-screened + 256K depth-tested 2026-08-15. Backup before ctx raise:
  # backups/config.yaml.bak-2026-08-15-pre-qwen38-ctx256k
  #
  # ARCH (read from the GGUF, matches the HF card): NOT plain dense - `qwen35`
  # hybrid: 64 layers, full attention every 4th layer (16 attn layers, GQA 4 KV
  # heads x 256 dim), the rest linear-attention/GDN with ctx-independent state.
  # So 256K KV is only ~8.5 GiB at q8_0 / ~4.3 GiB at q4_0, not the ~36 GiB a
  # true dense 27B would need. blk.64 is an MTP/nextn layer - the earlier "no
  # MTP" note was WRONG; current binary logs it as unused tensors and skips it.
  #
  # MEASURED 2026-08-15 (gtt-screen.sh + manual 258,446-token needle probe,
  # this exact cmd, gtt flat 0.03 throughout):
  #  - 256K + KV q8_0: DOES NOT FIT - clean alloc failure (KV buffer 8704 MiB,
  #    weights already 18.9 GiB resident). Fails closed, no GTT spill.
  #  - KV QUANT SPEED CLIFF: prefill 2052-tok probe: q8/q8 905 t/s, q4/q4
  #    923 t/s, but q5_1/q5_1 140 t/s and q8_0-K/q4_0-V 173 t/s (~6x - off the
  #    FA fast path). Only MATCHED q8/q8 or q4/q4 are usable here.
  #  - ADOPTED: 262144 ctx + q4_0/q4_0 KV = 22.4 GiB VRAM, gtt 0.03.
  #    Depth test AT the limit: 258,446-token prefill in 17.2 min (250 t/s avg),
  #    needle at ~2% depth retrieved exactly; decode at that depth 6.8 t/s.
  #    Shallow-depth decode t/s not yet measured. KV-q4 QUALITY vs q8 not
  #    A/B'd - if long-ctx quality disappoints, fall back to 196608 ctx +
  #    q8_0/q8_0 (fits by the same arithmetic, unscreened).
  #  - Vision path (mmproj on ROCm) still UNVERIFIED - if CLIP misbehaves,
  #    fall back to `--device Vulkan1` (glm-4-6v-flash convention).
  #
  # 2026-08-16 MTP ADOPTION (patched build-rocm binary, explicit path):
  #   - MTP head (blk.64) works via --spec-type draft-mtp n-max 2: decode
  #     31->44-50 t/s shallow (n=3, acc ~65%), 42.6 at 36K depth, needle exact.
  #   - VALIDATED: 131072 ctx + q8/q8 KV + MTP = 22.5 GiB launch, 22.8 under
  #     load (cuBLAS workspace grows ~0.23 GiB with depth), 36K needle PASS.
  #   - 147456 launches (23.2 GiB) but NOT depth-validated - candidate only.
  #   - 262144 + q4/q4 + MTP DOES NOT survive: launches at 20 MiB free, then
  #     CUBLAS_STATUS_ALLOC_FAILED at ~33K prefill depth (clean abort, kernel
  #     stayed clean). Never adopt MTP at 256K on 24 GB.
  #   - Previous 256K q4_0 no-MTP config preserved above in git-less history:
  #     ctx 262144 + q4_0/q4_0, drop the two spec lines to restore.
  # Device ROCm1 per rocm-dense-qwen35 rule (GDN decode is pathological on
  # Vulkan). Dual-card split rejected: mixed gfx1100+gfx1030 HIP hazard.
  # Quant UD-Q4_K_XL single file; UD-Q5/Q6 will NOT leave room for 256K KV.
  # Sampling = the card's THINKING-mode defaults (temp 1.0 / top-p 0.95 / top-k
  # 20 / min-p 0.0 / presence-penalty 0.0 / rep-penalty 1.0). For instruct/non-
  # thinking use temp 0.7 / top-p 0.80 / presence-penalty 1.5 instead.
  # SAMPLING CARD-CONFORMANT 2026-08-25 (amd/Instella-MoE-16B-A3B-Think):
  # temperature 0.6, top_p 0.95.
  Instella-MoE-16B-A3B-Think-Q8_0:
    aliases:
      - instella-moe-16b-a3b-think
    name: "AMD Instella MoE 16B-A3B Think Q8_0 - 164 tok/s FASTEST MEASURED - tier 2.18/3.00 ceil 1 - thinking 6/6 coding 3/3, weak:agentic - 32K ctx [NO TOOLS - template cannot call them]"
    description: "AMD's own MoE reasoner, 16B total / 3B active. Fastest decode measured on this box at 164 tok/s, 17.84 GB. Ranked 2026-08-08 after harness fixes: 2.18/3.00 ceiling 1, 78% - perfect thinking (6/6), coding (3/3) and consistency, but agentic 33% (misses state-revision and result-contradiction) and it confabulates under pressure. CANNOT TOOL-CALL AT ALL - DeepSeek-R1-era template, so the tools suite SKIPs and no destructive-tool hazard could be measured; its clean safety record is an artifact of that, NOT evidence it declines. Runs only on a local build of unmerged llama.cpp PR #26467. 32K is the model ceiling."
    cmd: |
