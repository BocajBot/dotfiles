shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "_GTK_FRAME_EXTENTS@"
];

fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;
inactive-opacity = 0.8;
frame-opacity = 0.7;
inactive-opacity-override = false;
focus-exclude = [ "class_g = 'Cairo-clock'" ];
opacity-rule = [
  "100:class_g = 'java-lang-Thread'",
  "100:class_g = 'firefox.exe'",
  "100:class_g = 'Brave-browser'",
  "100:class_g = 'Brave-browser-beta'",
  "100:class_g = 'org.remmina.Remmina'",
  "100:class_g = 'Wireshark'",
  "100:class_g = 'Mullvad Browser'",
  "100:class_g = 'ncplayer.exe'",
  "100:class_g = 'com.moonlight_stream.Moonlight'",
  "100:class_g = 'Moonlight'",
  "100:class_g = 'libreoffice-calc'",
  "100:class_g = 'librewolf'",
  "100:class_g = 'ninja_control_player'",
  "100:class_g = 'teams-for-linux'"
]
corner-radius = 0
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
blur-kern = "3x3box";
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"
];
# backend = "xrender";
# backend = "glx";
 backend = "egl";
dithered-present = false;
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
unredir-if-possible = false
detect-transient = true;
use-damage = true;
log-level = "warn";
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 1; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 1; }
  dropdown_menu = { opacity = 1; }
};
